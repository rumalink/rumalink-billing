<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>RumaLink Shop — Internet Equipment & Accessories</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet"/>
<style>
:root{--ink:#0a0f1e;--navy:#0d1530;--mid:#132044;--teal:#00d4aa;--teal2:#00b894;--amber:#f39c12;--red:#e74c3c;--green:#2ecc71;--white:#f0f4ff;--muted:#8899bb;--card:#111d3a;--border:#1e2f52;--radius:14px;--font-head:'Syne',sans-serif;--font-body:'DM Sans',sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--ink);color:var(--white);font-family:var(--font-body);line-height:1.6;min-height:100vh}
a{text-decoration:none;color:inherit}
.container{max-width:1200px;margin:0 auto;padding:0 20px}
/* Header */
.top{position:sticky;top:0;z-index:100;background:rgba(10,15,30,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.top-inner{display:flex;align-items:center;gap:20px;height:66px}
.logo{font-family:var(--font-head);font-size:1.35rem;font-weight:800;color:var(--teal);letter-spacing:-.5px}
.logo span{color:var(--white);font-weight:400}
.top-spacer{flex:1}
.top a.back{color:var(--muted);font-size:.88rem;font-weight:500;transition:color .2s}
.top a.back:hover{color:var(--teal)}
.cart-btn{position:relative;background:var(--mid);border:1px solid var(--border);border-radius:10px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:1.2rem;transition:border-color .2s}
.cart-btn:hover{border-color:var(--teal)}
.cart-count{position:absolute;top:-6px;right:-6px;background:var(--teal);color:var(--ink);font-size:.68rem;font-weight:700;min-width:19px;height:19px;border-radius:10px;display:flex;align-items:center;justify-content:center;padding:0 5px}
/* Hero */
.shop-hero{padding:44px 0 26px;text-align:center}
.shop-hero h1{font-family:var(--font-head);font-size:clamp(1.9rem,4vw,2.8rem);font-weight:800;margin-bottom:10px}
.shop-hero p{color:var(--muted);font-size:1rem;max-width:560px;margin:0 auto}
/* Categories */
.cats{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:26px 0 30px}
.cat-chip{background:var(--card);border:1px solid var(--border);border-radius:100px;padding:8px 18px;font-size:.86rem;font-weight:500;color:var(--muted);cursor:pointer;transition:all .18s}
.cat-chip:hover{color:var(--white);border-color:var(--teal)}
.cat-chip.active{background:var(--teal);color:var(--ink);border-color:var(--teal);font-weight:600}
/* Product grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:22px;padding-bottom:60px}
.pcard{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;transition:transform .2s,border-color .2s;cursor:pointer;display:flex;flex-direction:column}
.pcard:hover{transform:translateY(-4px);border-color:rgba(0,212,170,.4)}
.pcard-img{width:100%;aspect-ratio:1/1;object-fit:cover;background:var(--mid);display:flex;align-items:center;justify-content:center;font-size:3rem;color:var(--border)}
.pcard-body{padding:16px;display:flex;flex-direction:column;flex:1}
.pcard-cat{font-size:.72rem;text-transform:uppercase;letter-spacing:.5px;color:var(--teal);font-weight:600;margin-bottom:5px}
.pcard-name{font-family:var(--font-head);font-size:1rem;font-weight:700;margin-bottom:8px;line-height:1.3}
.pcard-desc{font-size:.82rem;color:var(--muted);margin-bottom:12px;flex:1;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pcard-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:auto}
.price{font-family:var(--font-head);font-size:1.2rem;font-weight:800;color:var(--white)}
.price small{font-size:.7rem;color:var(--muted);text-decoration:line-through;font-weight:400;margin-left:5px}
.btn{padding:9px 16px;border-radius:9px;font-family:var(--font-body);font-weight:600;font-size:.84rem;cursor:pointer;border:none;transition:all .2s;display:inline-flex;align-items:center;gap:6px}
.btn-teal{background:var(--teal);color:var(--ink)}
.btn-teal:hover{background:var(--teal2)}
.btn-outline{background:transparent;border:1.5px solid var(--border);color:var(--white)}
.btn-outline:hover{border-color:var(--teal)}
.btn-block{width:100%;justify-content:center;padding:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.stock-out{font-size:.75rem;color:var(--red);font-weight:600}
.empty{grid-column:1/-1;text-align:center;padding:70px 20px;color:var(--muted)}
.empty .big{font-size:3rem;margin-bottom:14px}
/* Drawer (cart / checkout) */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(3px);z-index:200;opacity:0;pointer-events:none;transition:opacity .25s}
.overlay.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:-460px;width:440px;max-width:92vw;height:100vh;background:var(--navy);border-left:1px solid var(--border);z-index:201;transition:right .3s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column}
.drawer.open{right:0}
.drawer-head{padding:20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:between;gap:12px}
.drawer-head h2{font-family:var(--font-head);font-size:1.15rem;font-weight:700;flex:1}
.drawer-close{background:none;border:none;color:var(--muted);font-size:1.5rem;cursor:pointer;line-height:1}
.drawer-body{flex:1;overflow-y:auto;padding:20px}
.drawer-foot{padding:20px;border-top:1px solid var(--border)}
.citem{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.citem-img{width:56px;height:56px;border-radius:9px;object-fit:cover;background:var(--mid);flex-shrink:0}
.citem-info{flex:1;min-width:0}
.citem-name{font-size:.88rem;font-weight:600;margin-bottom:3px}
.citem-price{font-size:.8rem;color:var(--muted)}
.qty{display:flex;align-items:center;gap:8px;margin-top:6px}
.qty button{width:26px;height:26px;border-radius:7px;background:var(--mid);border:1px solid var(--border);color:var(--white);cursor:pointer;font-size:1rem;line-height:1}
.qty span{min-width:24px;text-align:center;font-size:.86rem}
.citem-rm{background:none;border:none;color:var(--red);font-size:.76rem;cursor:pointer;margin-top:4px}
.sumrow{display:flex;justify-content:space-between;font-size:.9rem;margin-bottom:8px;color:var(--muted)}
.sumrow.total{color:var(--white);font-weight:700;font-size:1.1rem;font-family:var(--font-head);margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}
.fg{margin-bottom:14px}
.fg label{display:block;font-size:.78rem;color:var(--muted);margin-bottom:5px;font-weight:500}
.fg input,.fg textarea,.fg select{width:100%;background:var(--mid);border:1.5px solid var(--border);border-radius:9px;padding:11px 13px;color:var(--white);font-family:var(--font-body);font-size:.9rem;outline:none;transition:border-color .2s}
.fg input:focus,.fg textarea:focus,.fg select:focus{border-color:var(--teal)}
.fg select{appearance:none;-webkit-appearance:none;cursor:pointer;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%238899bb' stroke-width='2'><polyline points='6 9 12 15 18 9'/></svg>");background-repeat:no-repeat;background-position:right 13px center;padding-right:38px}
.fg select option{background:var(--navy);color:var(--white)}
.mapbtn{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.mapbtn button{flex:1}
.map-ok{font-size:.8rem;color:var(--green);font-weight:600}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--card);border:1px solid var(--teal);border-radius:10px;padding:13px 22px;font-size:.88rem;z-index:300;opacity:0;transition:all .3s;box-shadow:0 8px 30px rgba(0,0,0,.4)}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.toast.err{border-color:var(--red)}
/* product detail modal */
.pd-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}
@media(max-width:600px){.pd-grid{grid-template-columns:1fr}.drawer{width:100vw;max-width:100vw}}
.pd-img{width:100%;border-radius:12px;aspect-ratio:1/1;object-fit:cover;background:var(--mid)}
.spinner{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--teal);border-radius:50%;animation:spin .8s linear infinite;margin:30px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.pay-wait{text-align:center;padding:20px}
.tracknum{font-family:var(--font-head);font-size:1.6rem;font-weight:800;color:var(--teal);letter-spacing:1px;margin:12px 0}
</style>
</head>
<body>
<header class="top"><div class="container top-inner">
  <a href="/" class="logo">Ruma<span>Link</span> Shop</a>
  <div class="top-spacer"></div>
  <a href="/" class="back">← Main Site</a>
  <div class="cart-btn" onclick="openCart()">🛒<span class="cart-count" id="cart-count" style="display:none">0</span></div>
</div></header>

<div class="container">
  <div class="shop-hero">
    <h1>Internet Equipment & Accessories</h1>
    <p>Routers, antennas, cables and everything you need to get connected. Pay easily with M-Pesa.</p>
  </div>
  <div class="cats" id="cats"></div>
  <div class="grid" id="grid"><div class="empty"><div class="spinner"></div>Loading products…</div></div>
</div>

<!-- Cart / Checkout drawer -->
<div class="overlay" id="overlay" onclick="closeAll()"></div>
<div class="drawer" id="drawer">
  <div class="drawer-head"><h2 id="drawer-title">Your Cart</h2><button class="drawer-close" onclick="closeAll()">×</button></div>
  <div class="drawer-body" id="drawer-body"></div>
  <div class="drawer-foot" id="drawer-foot"></div>
</div>

<div class="toast" id="toast"></div>

<script>
const API='/api/shop';
let PRODUCTS=[], CATS=[], CART=JSON.parse(localStorage.getItem('rl_cart')||'[]'), SETTINGS={default_delivery_fee:0,free_delivery_over:null};
let activeCat='';

function toast(msg,isErr){ const t=document.getElementById('toast'); t.textContent=msg; t.className='toast show'+(isErr?' err':''); setTimeout(()=>t.className='toast',2600); }
function money(n){ return 'KES '+Number(n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}); }
function saveCart(){ localStorage.setItem('rl_cart',JSON.stringify(CART)); updateCartCount(); }
function updateCartCount(){ const n=CART.reduce((s,i)=>s+i.qty,0); const el=document.getElementById('cart-count'); el.textContent=n; el.style.display=n>0?'flex':'none'; }

async function load(){
  try{
    const [ps,cs,st]=await Promise.all([
      fetch(API+'/products').then(r=>r.json()),
      fetch(API+'/categories').then(r=>r.json()),
      fetch(API+'/settings-public').then(r=>r.json())
    ]);
    PRODUCTS=ps.products||[]; CATS=cs.categories||[]; SETTINGS=st||SETTINGS;
    renderCats(); renderGrid();
  }catch(e){ document.getElementById('grid').innerHTML='<div class="empty"><div class="big">⚠️</div>Could not load shop. Please try again.</div>'; }
  updateCartCount();
}
function renderCats(){
  const c=document.getElementById('cats');
  const allActive = activeCat==='' ? 'active' : '';
  let html = `<div class="cat-chip ${allActive}" onclick="filterCat('')">All</div>`;
  html += CATS.map(cat=>`<div class="cat-chip ${activeCat===cat.slug?'active':''}" onclick="filterCat('${cat.slug}')">${cat.name}</div>`).join('');
  c.innerHTML = html;
}
function filterCat(slug){ activeCat=slug; renderCats(); renderGrid(); }
function renderGrid(){
  const g=document.getElementById('grid');
  const list=activeCat?PRODUCTS.filter(p=>p.category_slug===activeCat):PRODUCTS;
  if(!list.length){ g.innerHTML='<div class="empty"><div class="big">📦</div>No products '+(activeCat?'in this category':'yet')+'. Check back soon!</div>'; return; }
  g.innerHTML=list.map(p=>{
    const out=p.track_stock&&p.stock_qty<=0;
    return `<div class="pcard" onclick="viewProduct('${p.id}')">
      ${p.image_url?`<img class="pcard-img" src="${p.image_url}" alt="${p.name}">`:`<div class="pcard-img">📦</div>`}
      <div class="pcard-body">
        ${p.category_name?`<div class="pcard-cat">${p.category_name}</div>`:''}
        <div class="pcard-name">${p.name}</div>
        <div class="pcard-desc">${p.description||''}</div>
        <div class="pcard-foot">
          <div class="price">${money(p.price)}${p.compare_price?`<small>${money(p.compare_price)}</small>`:''}</div>
          ${out?'<span class="stock-out">Out of stock</span>':`<button class="btn btn-teal" onclick="event.stopPropagation();addToCart('${p.id}')">Add +</button>`}
        </div>
      </div></div>`;
  }).join('');
}
function addToCart(id){
  const p=PRODUCTS.find(x=>x.id===id); if(!p) return;
  const ex=CART.find(i=>i.product_id===id);
  if(ex) ex.qty++; else CART.push({product_id:id,name:p.name,price:Number(p.price),image:p.image_url,qty:1});
  saveCart(); toast(p.name+' added to cart'); 
}
function viewProduct(id){
  const p=PRODUCTS.find(x=>x.id===id); if(!p) return;
  const out=p.track_stock&&p.stock_qty<=0;
  document.getElementById('drawer-title').textContent='Product';
  document.getElementById('drawer-body').innerHTML=`
    ${p.image_url?`<img class="pd-img" src="${p.image_url}">`:'<div class="pd-img" style="display:flex;align-items:center;justify-content:center;font-size:3rem">📦</div>'}
    <div style="margin-top:16px">
      ${p.category_name?`<div class="pcard-cat">${p.category_name}</div>`:''}
      <div style="font-family:var(--font-head);font-size:1.4rem;font-weight:800;margin:4px 0">${p.name}</div>
      <div class="price" style="margin:10px 0">${money(p.price)}${p.compare_price?`<small>${money(p.compare_price)}</small>`:''}</div>
      <p style="color:var(--muted);font-size:.9rem;margin-bottom:16px">${p.description||'No description.'}</p>
    </div>`;
  document.getElementById('drawer-foot').innerHTML=out?'<div class="stock-out" style="text-align:center">Out of stock</div>':`<button class="btn btn-teal btn-block" onclick="addToCart('${p.id}');openCart()">Add to Cart</button>`;
  openDrawer();
}
function openCart(){
  document.getElementById('drawer-title').textContent='Your Cart';
  renderCart(); openDrawer();
}
function renderCart(){
  const b=document.getElementById('drawer-body'), f=document.getElementById('drawer-foot');
  if(!CART.length){ b.innerHTML='<div class="empty" style="padding:40px 0"><div class="big">🛒</div>Your cart is empty</div>'; f.innerHTML=''; return; }
  b.innerHTML=CART.map(i=>`<div class="citem">
    ${i.image?`<img class="citem-img" src="${i.image}">`:'<div class="citem-img" style="display:flex;align-items:center;justify-content:center">📦</div>'}
    <div class="citem-info">
      <div class="citem-name">${i.name}</div>
      <div class="citem-price">${money(i.price)}</div>
      <div class="qty"><button onclick="chQty('${i.product_id}',-1)">−</button><span>${i.qty}</span><button onclick="chQty('${i.product_id}',1)">+</button></div>
      <button class="citem-rm" onclick="rmItem('${i.product_id}')">Remove</button>
    </div>
    <div style="font-weight:700;font-size:.9rem">${money(i.price*i.qty)}</div>
  </div>`).join('');
  const sub=CART.reduce((s,i)=>s+i.price*i.qty,0);
  let del=Number(SETTINGS.default_delivery_fee||0);
  if(SETTINGS.free_delivery_over!=null&&sub>=Number(SETTINGS.free_delivery_over))del=0;
  f.innerHTML=`<div class="sumrow"><span>Subtotal</span><span>${money(sub)}</span></div>
    <div class="sumrow"><span>Delivery</span><span>${del===0?'FREE':money(del)}</span></div>
    <div class="sumrow total"><span>Total</span><span>${money(sub+del)}</span></div>
    <button class="btn btn-teal btn-block" style="margin-top:14px" onclick="checkout()">Checkout →</button>`;
}
function chQty(id,d){ const i=CART.find(x=>x.product_id===id); if(!i)return; i.qty+=d; if(i.qty<=0)CART=CART.filter(x=>x.product_id!==id); saveCart(); renderCart(); }
function rmItem(id){ CART=CART.filter(x=>x.product_id!==id); saveCart(); renderCart(); }
function checkout(){
  if(!CART.length){ toast('Cart is empty',true); return; }
  const freeLocs=(SETTINGS.free_delivery_locations||[]);
  const locOpts=freeLocs.map(l=>`<option value="${l}">${l} (Free delivery)</option>`).join('')+'<option value="__other__">Other location (not listed)</option>';
  _mapLocation='';
  document.getElementById('drawer-title').textContent='Checkout';
  document.getElementById('drawer-body').innerHTML=`
    <div class="fg"><label>Full Name *</label><input id="co-name" placeholder="Your name"></div>
    <div class="fg"><label>M-Pesa Phone *</label><input id="co-phone" placeholder="0712345678" inputmode="tel"></div>
    <div class="fg"><label>Email (optional)</label><input id="co-email" placeholder="you@email.com"></div>
    <div class="fg" style="background:var(--mid);padding:12px;border-radius:10px;border:1px solid var(--border)">
      <label style="display:flex;align-items:center;gap:9px;cursor:pointer;margin:0"><input type="checkbox" id="co-needdel" style="width:auto" onchange="toggleDelivery()"> <span style="color:var(--white);font-size:.9rem;font-weight:500">🚚 Do you need delivery?</span></label>
    </div>
    <div id="co-delivery-fields" style="display:none;margin-top:14px">
      <div class="fg"><label>Delivery Location *</label><select id="co-location" onchange="onLocationChange()">${locOpts}</select></div>
      <div id="co-other-wrap" style="display:none">
        <div class="fg"><label>Your Location *</label><input id="co-otherloc" placeholder="e.g. Thika, Juja, Ruiru"></div>
        <div style="background:rgba(243,156,18,.12);border:1px solid rgba(243,156,18,.35);border-radius:9px;padding:10px 12px;font-size:.8rem;color:var(--amber);margin-bottom:12px">ℹ️ Delivery is available to this location. A delivery fee may apply and will be arranged with you after your order.</div>
      </div>
      <div class="fg"><label>Delivery Address / Details *</label><textarea id="co-addr" rows="2" placeholder="Estate, house/landmark, directions"></textarea></div>
      <div class="fg"><label>📍 Pin Your Location (optional, helps delivery)</label>
        <div class="mapbtn"><button type="button" class="btn btn-outline" onclick="shareLocation()">📍 Share My Location</button><span id="co-map-status" class="map-ok"></span></div>
        <input id="co-maplink" placeholder="…or paste a Google Maps link" oninput="onMapLinkInput()">
        <div style="font-size:.72rem;color:var(--muted);margin-top:4px">Tap the button to share GPS, or open Google Maps → your spot → Share → copy link → paste here.</div>
      </div>
    </div>
    <div class="fg"><label>Notes (optional)</label><textarea id="co-notes" rows="2" placeholder="Any special instructions"></textarea></div>`;
  renderCheckoutTotals();
}
function toggleDelivery(){
  const need=document.getElementById('co-needdel').checked;
  document.getElementById('co-delivery-fields').style.display=need?'block':'none';
  if(need) onLocationChange();
  renderCheckoutTotals();
}
function onLocationChange(){
  const sel=document.getElementById('co-location');
  const other=sel&&sel.value==='__other__';
  const ow=document.getElementById('co-other-wrap');
  if(ow) ow.style.display=other?'block':'none';
  renderCheckoutTotals();
}
function renderCheckoutTotals(){
  const sub=CART.reduce((s,i)=>s+i.price*i.qty,0);
  const need=(document.getElementById('co-needdel')||{}).checked;
  const sel=document.getElementById('co-location');
  let delText='—';
  if(!need){ delText='No delivery (pickup)'; }
  else if(sel&&sel.value==='__other__'){ delText='Fee may apply'; }
  else if(sel&&sel.value){ delText='FREE'; }
  document.getElementById('drawer-foot').innerHTML=`
    <div class="sumrow"><span>Subtotal</span><span>${money(sub)}</span></div>
    <div class="sumrow"><span>Delivery</span><span>${delText}</span></div>
    <div class="sumrow total"><span>Total</span><span>${money(sub)}</span></div>
    ${need&&sel&&sel.value==='__other__'?'<div style="font-size:.74rem;color:var(--muted);margin-bottom:8px">You pay for items now; delivery fee arranged after.</div>':''}
    <button class="btn btn-teal btn-block" style="margin-top:6px" id="pay-btn" onclick="pay()">Pay with M-Pesa</button>
    <button class="btn btn-outline btn-block" style="margin-top:8px" onclick="openCart()">← Back to Cart</button>`;
}
let _mapLocation='';
function shareLocation(){
  const st=document.getElementById('co-map-status');
  if(!navigator.geolocation){ toast('Geolocation not supported; paste a link instead',true); return; }
  st.textContent='Locating…'; st.style.color='var(--muted)';
  navigator.geolocation.getCurrentPosition(
    pos=>{ _mapLocation=pos.coords.latitude.toFixed(6)+','+pos.coords.longitude.toFixed(6);
      st.textContent='✓ Location captured'; st.style.color='var(--green)';
      const li=document.getElementById('co-maplink'); if(li) li.value='';
    },
    err=>{ st.textContent='Could not get location — paste a link'; st.style.color='var(--amber)'; },
    { enableHighAccuracy:true, timeout:10000 }
  );
}
function onMapLinkInput(){
  const v=(document.getElementById('co-maplink')||{}).value||'';
  if(v.trim()){ _mapLocation=v.trim(); const st=document.getElementById('co-map-status'); if(st){st.textContent='';} }
}
async function pay(){
  const name=document.getElementById('co-name').value.trim();
  const phone=document.getElementById('co-phone').value.trim();
  const email=document.getElementById('co-email').value.trim();
  const notes=document.getElementById('co-notes').value.trim();
  const need=(document.getElementById('co-needdel')||{}).checked;
  let addr='', location='';
  if(need){
    const sel=document.getElementById('co-location');
    addr=(document.getElementById('co-addr')||{}).value||'';
    addr=addr.trim();
    if(sel&&sel.value==='__other__'){ location=(document.getElementById('co-otherloc')||{}).value.trim(); }
    else { location=sel?sel.value:''; }
    if(!location){ toast('Please choose or enter your delivery location',true); return; }
    if(!addr){ toast('Please enter your delivery address/details',true); return; }
  } else {
    addr='Pickup / no delivery';
  }
  if(!name||!phone){ toast('Name and phone are required',true); return; }
  const btn=document.getElementById('pay-btn'); btn.disabled=true; btn.textContent='Sending…';
  try{
    const res=await fetch(API+'/checkout',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({customer_name:name,customer_phone:phone,customer_email:email,delivery_address:addr,delivery_notes:notes,
        needs_delivery:need,delivery_location:location,map_location:(need?_mapLocation:''),
        items:CART.map(i=>({product_id:i.product_id,quantity:i.qty}))})});
    const d=await res.json();
    if(!res.ok) throw new Error(d.error||'Checkout failed');
    showPayWait(d.order_id,d.order_number);
  }catch(e){ toast(e.message,true); btn.disabled=false; btn.textContent='Pay with M-Pesa'; }
}
function showPayWait(orderId,orderNumber){
  document.getElementById('drawer-title').textContent='Complete Payment';
  document.getElementById('drawer-body').innerHTML=`<div class="pay-wait">
    <div class="spinner"></div>
    <h3 style="font-family:var(--font-head);margin-bottom:8px">Check your phone 📲</h3>
    <p style="color:var(--muted);font-size:.9rem">Enter your M-Pesa PIN to complete payment for order <b>${orderNumber}</b>.</p>
  </div>`;
  document.getElementById('drawer-foot').innerHTML='';
  // Poll payment status
  let tries=0;
  const iv=setInterval(async()=>{
    tries++;
    try{
      const r=await fetch(API+'/order-status/'+orderId).then(r=>r.json());
      if(r.payment_status==='paid'){ clearInterval(iv); paySuccess(orderNumber); }
      else if(r.payment_status==='failed'){ clearInterval(iv); toast('Payment failed or cancelled',true); checkout(); }
    }catch(e){}
    if(tries>40){ clearInterval(iv); toast('Payment is taking long. Check order status later with '+orderNumber,true); }
  },3000);
}
function paySuccess(orderNumber){
  CART=[]; saveCart();
  document.getElementById('drawer-title').textContent='Order Confirmed';
  document.getElementById('drawer-body').innerHTML=`<div class="pay-wait">
    <div style="font-size:3.4rem;margin-bottom:8px">✅</div>
    <h3 style="font-family:var(--font-head);margin-bottom:6px">Payment Received!</h3>
    <p style="color:var(--muted);font-size:.9rem">Your order tracking number is</p>
    <div class="tracknum">${orderNumber}</div>
    <p style="color:var(--muted);font-size:.84rem">Save this number to track your delivery. We'll be in touch shortly.</p>
  </div>`;
  document.getElementById('drawer-foot').innerHTML='<button class="btn btn-teal btn-block" onclick="closeAll();load()">Continue Shopping</button>';
}
function openDrawer(){ document.getElementById('overlay').classList.add('open'); document.getElementById('drawer').classList.add('open'); }
function closeAll(){ document.getElementById('overlay').classList.remove('open'); document.getElementById('drawer').classList.remove('open'); }
load();
</script>
</body>
