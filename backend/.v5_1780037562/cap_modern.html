<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>WiFi Login</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
:root{--primary:#00d4aa;--ink:#0a0f1e;--card:#111d3a;--border:#1e2f52;--muted:#8899bb;--white:#f0f4ff}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--ink);font-family:'DM Sans',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;position:relative;overflow:hidden}
body::before{content:'';position:fixed;top:-200px;left:50%;transform:translateX(-50%);width:700px;height:700px;background:radial-gradient(circle,rgba(0,212,170,.1),transparent 65%);pointer-events:none}
.card{background:var(--card);border:1px solid var(--border);border-radius:24px;padding:36px 30px;width:100%;max-width:440px;position:relative;z-index:1;box-shadow:0 24px 80px rgba(0,0,0,.5)}
.logo-wrap{text-align:center;margin-bottom:22px}
.logo-text{font-family:'Syne',sans-serif;font-size:1.5rem;font-weight:800;color:var(--primary)}
.welcome{text-align:center;margin-bottom:28px}
.welcome h1{font-family:'Syne',sans-serif;font-size:1.3rem;color:var(--white);font-weight:700;margin-bottom:6px}
.welcome p{font-size:.86rem;color:var(--muted);font-weight:300}
.packages{display:flex;flex-direction:column;gap:10px;margin-bottom:22px}
.pkg{border:1.5px solid var(--border);border-radius:14px;padding:15px 17px;cursor:pointer;transition:all .2s;display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,.02)}
.pkg:hover,.pkg.selected{border-color:var(--primary);background:rgba(0,212,170,.06)}
.pkg-name{font-weight:500;color:var(--white);font-size:.92rem}
.pkg-detail{font-size:.75rem;color:var(--muted);margin-top:3px}
.pkg-price{font-family:'Syne',sans-serif;font-weight:700;font-size:1.05rem;color:var(--primary);white-space:nowrap;margin-left:12px}
.section-label{font-size:.7rem;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:18px 0 10px;font-weight:600}
.fg{margin-bottom:12px}
.fg label{display:block;font-size:.78rem;color:var(--muted);margin-bottom:5px}
.fg input{width:100%;background:rgba(255,255,255,.04);border:1.5px solid var(--border);border-radius:9px;padding:11px 14px;color:var(--white);font-family:'DM Sans',sans-serif;font-size:.9rem;outline:none;transition:border-color .2s}
.fg input:focus{border-color:var(--primary)}
.fg input::placeholder{color:var(--border)}
.btn{width:100%;padding:13px;border-radius:11px;border:none;font-family:'DM Sans',sans-serif;font-size:.9rem;font-weight:600;cursor:pointer;transition:all .2s;letter-spacing:.3px}
.btn-primary{background:var(--primary);color:#0d1530;margin-top:4px}
.btn-primary:hover{opacity:.9;transform:translateY(-1px)}
.btn-outline{background:transparent;border:1.5px solid var(--border);color:var(--muted);margin-top:8px}
.btn-outline:hover{border-color:var(--primary);color:var(--primary)}
.powered{text-align:center;font-size:.7rem;color:var(--border);margin-top:20px}
.powered a{color:var(--primary);text-decoration:none}
.msg{padding:12px 14px;border-radius:10px;font-size:.86rem;margin-top:12px;display:none;white-space:pre-line}
.msg.success{background:rgba(0,212,170,.1);color:var(--primary);border:1px solid rgba(0,212,170,.2)}
.msg.error{background:rgba(231,76,60,.1);color:#e74c3c;border:1px solid rgba(231,76,60,.2)}
</style>
</head>
<body>
<div class="card">
  <div class="logo-wrap"><div class="logo-text" id="isp-name">WiFi Network</div></div>
  <div class="welcome">
    <h1 id="welcome-title">Connect to WiFi</h1>
    <p id="welcome-sub">Choose your package and pay with MPesa</p>
  </div>
  <div class="section-label">Available Packages</div>
  <div class="packages" id="packages-list"></div>
  <div class="section-label">Pay with MPesa</div>
  <div class="fg"><label>Phone Number</label><input type="tel" id="phone" placeholder="0712 345 678"/></div>
  <button class="btn btn-primary" onclick="initiatePayment()">💳 Pay & Connect Now</button>
  <div class="section-label">Have a Voucher?</div>
  <div class="fg"><label>Voucher Code</label><input type="text" id="voucher-code" placeholder="Enter code…" style="text-transform:uppercase"/></div>
  <div class="fg"><label>Phone (for SMS receipt)</label><input type="tel" id="voucher-phone" placeholder="Optional"/></div>
  <button class="btn btn-outline" onclick="redeemVoucher()">🎟️ Redeem Voucher</button>
  <div class="msg" id="msg"></div>
  <div class="powered" id="powered-by">Powered by <a href="https://rumalink.co.ke">RumaLink Enterprise</a></div>
</div>
<script>
const API=window.RUMALINK_API||'https://rumalinkenterprise.online/api';
const ISP_ID=window.PORTAL_ISP_ID||new URLSearchParams(location.search).get('isp');
let sel=null;
async function init(){
  if(!ISP_ID)return;
  const res=await fetch(`${API}/captive/${ISP_ID}`);
  const {isp,portal,packages}=await res.json();
  document.title=isp.company_name+' WiFi';
  document.getElementById('isp-name').textContent=isp.company_name;
  document.getElementById('welcome-title').textContent=portal.welcome_title||'Connect to WiFi';
  document.getElementById('welcome-sub').textContent=portal.welcome_subtitle||'Choose your package';
  document.documentElement.style.setProperty('--primary',portal.primary_color||'#00d4aa');
  if(isp.logo_url)document.getElementById('isp-name').innerHTML=`<img src="${API.replace('/api','')}${isp.logo_url}" style="max-height:50px;border-radius:8px;display:block;margin:0 auto 8px"/>`;
  if(!portal.show_powered_by)document.getElementById('powered-by').style.display='none';
  const list=document.getElementById('packages-list');
  list.innerHTML=(packages||[]).map(p=>`
    <div class="pkg" id="p-${p.id}" onclick="selectPkg('${p.id}',${p.price})">
      <div><div class="pkg-name">${p.name}</div><div class="pkg-detail">${p.duration_hours?p.duration_hours+'h':'Unlimited'}${p.bandwidth_down_mbps?' · '+p.bandwidth_down_mbps+'Mbps':''}</div></div>
      <div class="pkg-price">KES ${parseFloat(p.price).toLocaleString()}</div>
    </div>`).join('');
}
function selectPkg(id,price){sel={id,price};document.querySelectorAll('.pkg').forEach(p=>p.classList.remove('selected'));document.getElementById('p-'+id)?.classList.add('selected');}
async function initiatePayment(){
  if(!sel)return showMsg('Select a package first.','error');
  const phone=document.getElementById('phone').value.trim();
  if(!phone)return showMsg('Enter your phone number.','error');
  try{
    const r=await fetch(`${API}/captive/${ISP_ID}/pay`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone,package_id:sel.id,amount:sel.price})});
    const j=await r.json();
    showMsg(r.ok?`📱 MPesa prompt sent to ${phone}. Enter PIN to connect.\nYour voucher will arrive via SMS.`:j.error||'Payment failed.',r.ok?'success':'error');
  }catch(e){showMsg('Network error.','error');}
}
async function redeemVoucher(){
  const code=document.getElementById('voucher-code').value.trim().toUpperCase();
  const phone=document.getElementById('voucher-phone').value.trim();
  if(!code)return showMsg('Enter a voucher code.','error');
  try{
    const r=await fetch(`${API}/captive/${ISP_ID}/redeem`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code,phone})});
    const j=await r.json();
    const exp=j.expires_at?`\nExpires: ${new Date(j.expires_at).toLocaleString('en-KE')}`:'';
    showMsg(r.ok?`✅ Connected!\nCode: ${j.username}${exp}${phone?'\n📱 SMS sent':''}`:j.error||'Invalid code.',r.ok?'success':'error');
  }catch(e){showMsg('Network error.','error');}
}
function showMsg(m,t){const e=document.getElementById('msg');e.textContent=m;e.className='msg '+t;e.style.display='block';}
init();
</script>

<!-- Payment spinner widget -->
<div id="rml-spinner-include"></div>
<script>
fetch('/captive/payment-spinner.html').then(r => r.text()).then(html => {
  document.getElementById('rml-spinner-include').innerHTML = html;
  // Re-execute scripts (innerHTML doesn't run them)
  document.querySelectorAll('#rml-spinner-include script').forEach(s => {
    var n = document.createElement('script');
    n.textContent = s.textContent;
    document.body.appendChild(n);
  });
});
</script>

<script>
// Hook into existing pay() flow — wrap fetch responses to show spinner
(function(){
  var origFetch = window.fetch;
  window.fetch = function(url, opts) {
    var prom = origFetch.apply(this, arguments);
    if (typeof url === 'string' && url.indexOf('/pay') > -1 && opts && opts.method === 'POST') {
      prom.then(r => r.clone().json()).then(data => {
        if (data && data.payment_id && typeof rumalinkShowPaymentSpinner === 'function') {
          var body = {};
          try { body = JSON.parse(opts.body || '{}'); } catch(e){}
          var ispId = (typeof ISP_ID !== 'undefined') ? ISP_ID : (location.search.match(/isp=([^&]+)/)||[])[1];
          rumalinkShowPaymentSpinner({
            phone: body.phone,
            amount: data.amount,
            paymentId: data.payment_id,
            statusUrl: '/api/captive/' + ispId + '/payment-status/' + data.payment_id
          });
        }
      }).catch(()=>{});
    }
    return prom;
  };
})();
</script>
</body>
</html>
