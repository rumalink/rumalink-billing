<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>WiFi Login</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{--primary:#00d4aa;--accent:#f39c12}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Poppins',sans-serif;min-height:100vh;display:flex;background:#1a1a2e;background-size:cover;background-position:center}
.left{flex:1;background:linear-gradient(135deg,rgba(0,212,170,.9),rgba(13,21,48,.95));display:flex;flex-direction:column;justify-content:center;padding:48px;position:relative;overflow:hidden;min-height:100vh}
.left::before{content:'';position:absolute;inset:0;background:url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="20" cy="20" r="40" fill="rgba(255,255,255,.03)"/><circle cx="80" cy="80" r="50" fill="rgba(255,255,255,.02)"/></svg>') no-repeat center;background-size:cover}
.left-content{position:relative;z-index:1}
.left h1{font-size:clamp(1.8rem,4vw,2.8rem);font-weight:700;color:#fff;line-height:1.2;margin-bottom:16px}
.left p{font-size:1rem;color:rgba(255,255,255,.75);font-weight:300;line-height:1.7;max-width:340px}
.left-logo{margin-bottom:32px}
.left-logo img{max-height:56px;border-radius:10px}
.left-logo .name{font-size:1.4rem;font-weight:700;color:#fff;margin-top:8px}
.features{margin-top:36px;display:flex;flex-direction:column;gap:14px}
.feat{display:flex;align-items:center;gap:12px;color:rgba(255,255,255,.85);font-size:.88rem}
.feat-icon{width:34px;height:34px;background:rgba(255,255,255,.15);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:.95rem;flex-shrink:0}
.right{width:420px;min-height:100vh;background:#fff;overflow-y:auto;padding:36px 32px;display:flex;flex-direction:column;justify-content:center;flex-shrink:0}
.right h2{font-size:1.2rem;font-weight:700;color:#1a1a2e;margin-bottom:4px}
.right .sub{font-size:.83rem;color:#6b7280;margin-bottom:24px;font-weight:300}
.pkgs{display:flex;flex-direction:column;gap:8px;margin-bottom:20px}
.pkg{border:1.5px solid #e5e7eb;border-radius:10px;padding:12px 14px;cursor:pointer;transition:all .15s;display:flex;justify-content:space-between;align-items:center}
.pkg:hover,.pkg.sel{border-color:var(--primary);background:#f0fdfb}
.pkg-n{font-size:.88rem;font-weight:600;color:#1a1a2e}
.pkg-d{font-size:.73rem;color:#9ca3af;margin-top:2px}
.pkg-p{font-weight:700;font-size:.95rem;color:var(--primary);white-space:nowrap}
.sep{display:flex;align-items:center;gap:8px;margin:14px 0;font-size:.76rem;color:#9ca3af}
.sep::before,.sep::after{content:'';flex:1;height:1px;background:#e5e7eb}
.field{margin-bottom:12px}
.field label{display:block;font-size:.76rem;font-weight:500;color:#6b7280;margin-bottom:4px}
.field input{width:100%;border:1.5px solid #e5e7eb;border-radius:8px;padding:10px 12px;font-family:'Poppins',sans-serif;font-size:.88rem;outline:none;transition:border-color .15s}
.field input:focus{border-color:var(--primary)}
.btn{width:100%;padding:12px;border-radius:9px;border:none;font-family:'Poppins',sans-serif;font-size:.88rem;font-weight:600;cursor:pointer;transition:all .15s;letter-spacing:.2px}
.btn-p{background:var(--primary);color:#0d1530}.btn-p:hover{opacity:.9}
.btn-o{background:transparent;border:1.5px solid #e5e7eb;color:#6b7280;margin-top:8px}.btn-o:hover{border-color:var(--primary);color:var(--primary)}
.msg{padding:10px 12px;border-radius:8px;font-size:.82rem;margin-top:10px;display:none;white-space:pre-line}
.msg.s{background:#d1fae5;color:#065f46}.msg.e{background:#fee2e2;color:#991b1b}
.footer{margin-top:24px;text-align:center;font-size:.7rem;color:#d1d5db}
.footer a{color:var(--primary);text-decoration:none}
@media(max-width:700px){.left{display:none}.right{width:100%;padding:28px 20px}}
</style>
</head>
<body>
<div class="left">
  <div class="left-content">
    <div class="left-logo"><div class="name" id="isp-name-left">WiFi Network</div></div>
    <h1 id="tagline">Fast, Reliable Internet Access</h1>
    <p id="left-sub">Connect in seconds. Pay with MPesa. Enjoy unlimited browsing.</p>
    <div class="features">
      <div class="feat"><div class="feat-icon">⚡</div>Fast Speeds</div>
      <div class="feat"><div class="feat-icon">📱</div>Pay via MPesa</div>
      <div class="feat"><div class="feat-icon">🔒</div>Secure Connection</div>
    </div>
  </div>
</div>
<div class="right">
  <h2 id="welcome-title">Get Connected</h2>
  <div class="sub" id="welcome-sub">Select a package and pay with MPesa</div>
  <div class="pkgs" id="pkg-list"></div>
  <div class="field"><label>MPesa Phone Number</label><input type="tel" id="phone" placeholder="0712 345 678"/></div>
  <button class="btn btn-p" onclick="pay()">Pay & Connect Now</button>
  <div class="sep">or use a voucher</div>
  <div class="field"><label>Voucher Code</label><input type="text" id="vcode" placeholder="Enter voucher code" style="text-transform:uppercase"/></div>
  <div class="field"><label>Phone for SMS receipt (optional)</label><input type="tel" id="vph" placeholder="0712 345 678"/></div>
  <button class="btn btn-o" onclick="redeem()">🎟️ Redeem Voucher</button>
  <div class="msg" id="msg"></div>
  <div class="footer" id="footer">Powered by <a href="https://rumalink.co.ke">RumaLink Enterprise</a></div>
</div>
<script>
const API=window.RUMALINK_API||'https://rumalinkenterprise.online/api';
const ISP_ID=window.PORTAL_ISP_ID||new URLSearchParams(location.search).get('isp');
let sel=null;
async function init(){
  if(!ISP_ID)return;
  const r=await fetch(`${API}/captive/${ISP_ID}`);
  const {isp,portal,packages}=await r.json();
  document.title=isp.company_name+' WiFi';
  ['isp-name-left'].forEach(id=>document.getElementById(id)&&(document.getElementById(id).textContent=isp.company_name));
  document.getElementById('welcome-title').textContent=portal.welcome_title||'Get Connected';
  document.getElementById('welcome-sub').textContent=portal.welcome_subtitle||'Select a package';
  document.documentElement.style.setProperty('--primary',portal.primary_color||'#00d4aa');
  if(portal.bg_image_url)document.querySelector('.left').style.backgroundImage=`url(${portal.bg_image_url})`;
  if(!portal.show_powered_by)document.getElementById('footer').style.display='none';
  if(isp.logo_url)document.querySelector('.left-logo').innerHTML=`<img src="${API.replace('/api','')}${isp.logo_url}"/><div class="name">${isp.company_name}</div>`;
  const list=document.getElementById('pkg-list');
  list.innerHTML=(packages||[]).map(p=>`
    <div class="pkg" id="p-${p.id}" onclick="pick('${p.id}',${p.price})">
      <div><div class="pkg-n">${p.name}</div><div class="pkg-d">${p.duration_hours?p.duration_hours+'h':''} ${p.bandwidth_down_mbps?'· '+p.bandwidth_down_mbps+'Mbps':''}</div></div>
      <div class="pkg-p">KES ${parseFloat(p.price).toLocaleString()}</div>
    </div>`).join('');
}
function pick(id,price){sel={id,price};document.querySelectorAll('.pkg').forEach(p=>p.classList.remove('sel'));document.getElementById('p-'+id)?.classList.add('sel');}
async function pay(){
  if(!sel)return msg('Select a package first.','e');
  const ph=document.getElementById('phone').value.trim();
  if(!ph)return msg('Enter MPesa number.','e');
  const r=await fetch(`${API}/captive/${ISP_ID}/pay`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:ph,package_id:sel.id,amount:sel.price})});
  const j=await r.json();
  msg(r.ok?`📱 MPesa prompt sent to ${ph}.\nEnter PIN to complete. SMS voucher incoming.`:j.error||'Failed.',r.ok?'s':'e');
}
async function redeem(){
  const code=document.getElementById('vcode').value.trim().toUpperCase();
  const ph=document.getElementById('vph').value.trim();
  if(!code)return msg('Enter a voucher code.','e');
  const r=await fetch(`${API}/captive/${ISP_ID}/redeem`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code,phone:ph})});
  const j=await r.json();
  const ex=j.expires_at?`\nExpires: ${new Date(j.expires_at).toLocaleString('en-KE')}`:'';
  msg(r.ok?`✅ Connected! Code: ${j.username}${ex}${ph?'\nSMS sent to '+ph:''}`:j.error||'Invalid code.',r.ok?'s':'e');
}
function msg(m,t){const e=document.getElementById('msg');e.textContent=m;e.className='msg '+t;e.style.display='block';}
init();
</script>

<!-- Payment spinner widget -->
<div id="rml-spinner-include"></div>
<script>
fetch('/captive/payment-spinner.html').then(r => r.text()).then(html => {
  document.getElementById('rml-spinner-include').innerHTML = html;
  // Re-execute scripts (innerHTML doesn't run them)
  document.querySelectorAll('#rml-spinner-include script').forEach(s => {
    var n = document.createElement('script');
    n.textContent = s.textContent;
    document.body.appendChild(n);
  });
});
</script>

<script>
// Hook into existing pay() flow — wrap fetch responses to show spinner
(function(){
  var origFetch = window.fetch;
  window.fetch = function(url, opts) {
    var prom = origFetch.apply(this, arguments);
    if (typeof url === 'string' && url.indexOf('/pay') > -1 && opts && opts.method === 'POST') {
      prom.then(r => r.clone().json()).then(data => {
        if (data && data.payment_id && typeof rumalinkShowPaymentSpinner === 'function') {
          var body = {};
          try { body = JSON.parse(opts.body || '{}'); } catch(e){}
          var ispId = (typeof ISP_ID !== 'undefined') ? ISP_ID : (location.search.match(/isp=([^&]+)/)||[])[1];
          rumalinkShowPaymentSpinner({
            phone: body.phone,
            amount: data.amount,
            paymentId: data.payment_id,
            statusUrl: '/api/captive/' + ispId + '/payment-status/' + data.payment_id
          });
        }
      }).catch(()=>{});
    }
    return prom;
  };
})();
</script>
</body>
</html>
