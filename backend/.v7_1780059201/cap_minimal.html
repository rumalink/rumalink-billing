<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>WiFi Login</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{--p:#00d4aa;--t:#111827;--m:#9ca3af;--b:#f3f4f6;--w:#fff;--r:#e5e7eb}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--b);font-family:'Inter',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px}
.top-bar{width:100%;max-width:400px;text-align:center;margin-bottom:20px}
.isp-name{font-size:1.1rem;font-weight:700;color:var(--t);letter-spacing:-.3px}
.wifi-icon{font-size:2.5rem;margin-bottom:8px}
.card{background:var(--w);border-radius:16px;width:100%;max-width:400px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.08),0 8px 30px rgba(0,0,0,.06)}
.card-head{padding:20px 22px;border-bottom:1px solid var(--r)}
.card-head h2{font-size:1rem;font-weight:600;color:var(--t)}
.card-head p{font-size:.8rem;color:var(--m);margin-top:2px}
.pkg-list{padding:14px 22px;display:flex;flex-direction:column;gap:8px}
.pkg{display:flex;align-items:center;gap:12px;padding:12px;border:1.5px solid var(--r);border-radius:10px;cursor:pointer;transition:all .15s}
.pkg:hover,.pkg.sel{border-color:var(--p);background:#f0fdfb}
.pkg-radio{width:18px;height:18px;border:2px solid var(--r);border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .15s}
.pkg.sel .pkg-radio{border-color:var(--p);background:var(--p)}
.pkg.sel .pkg-radio::after{content:'';width:6px;height:6px;background:#fff;border-radius:50%}
.pkg-info{flex:1}
.pkg-name{font-size:.88rem;font-weight:600;color:var(--t)}
.pkg-meta{font-size:.74rem;color:var(--m);margin-top:1px}
.pkg-price{font-size:.95rem;font-weight:700;color:var(--p);white-space:nowrap}
.card-section{padding:14px 22px;border-top:1px solid var(--r)}
.field{margin-bottom:10px}
.field label{display:block;font-size:.75rem;font-weight:500;color:var(--m);margin-bottom:4px;text-transform:uppercase;letter-spacing:.3px}
.field input{width:100%;border:1.5px solid var(--r);border-radius:8px;padding:10px 12px;font-family:'Inter',sans-serif;font-size:.88rem;outline:none;color:var(--t);transition:border-color .15s}
.field input:focus{border-color:var(--p)}
.btn{width:100%;padding:12px;border-radius:8px;border:none;font-family:'Inter',sans-serif;font-size:.88rem;font-weight:600;cursor:pointer;transition:background .15s}
.btn-p{background:var(--p);color:#0d1530}.btn-p:hover{opacity:.9}
.btn-s{background:transparent;border:1.5px solid var(--r);color:var(--m);margin-top:8px}.btn-s:hover{border-color:var(--p);color:var(--p)}
.msg{margin:10px 22px;padding:10px 12px;border-radius:8px;font-size:.82rem;display:none;white-space:pre-line}
.msg.s{background:#d1fae5;color:#065f46;border:1px solid #a7f3d0}
.msg.e{background:#fee2e2;color:#991b1b;border:1px solid #fecaca}
.footer{padding:14px 22px;text-align:center;font-size:.7rem;color:var(--m);border-top:1px solid var(--r)}
.footer a{color:var(--p);text-decoration:none}
</style>
</head>
<body>
<div class="top-bar">
  <div class="wifi-icon">📶</div>
  <div class="isp-name" id="isp-name">WiFi Network</div>
</div>
<div class="card">
  <div class="card-head">
    <h2 id="welcome-title">Select Your Package</h2>
    <p id="welcome-sub">Pay with MPesa or enter a voucher</p>
  </div>
  <div class="pkg-list" id="pkg-list"></div>
  <div class="card-section">
    <div class="field"><label>MPesa Phone</label><input type="tel" id="phone" placeholder="0712 345 678"/></div>
    <button class="btn btn-p" onclick="pay()">Pay & Connect</button>
  </div>
  <div class="card-section">
    <div class="field"><label>Voucher Code</label><input type="text" id="vcode" placeholder="Enter code" style="text-transform:uppercase"/></div>
    <div class="field"><label>Phone (SMS receipt)</label><input type="tel" id="vphone" placeholder="Optional"/></div>
    <button class="btn btn-s" onclick="redeem()">Redeem Voucher</button>
  </div>
  <div class="msg" id="msg"></div>
  <div class="footer" id="footer">Powered by <a href="https://rumalink.co.ke">RumaLink Enterprise</a></div>
</div>
<script>
const API=window.RUMALINK_API||'https://rumalinkenterprise.online/api';
const ISP_ID=window.PORTAL_ISP_ID||new URLSearchParams(location.search).get('isp');
let sel=null;
async function init(){
  if(!ISP_ID)return;
  const r=await fetch(`${API}/captive/${ISP_ID}`);
  const {isp,portal,packages}=await r.json();
  document.title=isp.company_name+' WiFi';
  document.getElementById('isp-name').textContent=isp.company_name;
  document.getElementById('welcome-title').textContent=portal.welcome_title||'Select Your Package';
  document.getElementById('welcome-sub').textContent=portal.welcome_subtitle||'Pay with MPesa or enter a voucher';
  document.documentElement.style.setProperty('--p',portal.primary_color||'#00d4aa');
  if(!portal.show_powered_by)document.getElementById('footer').style.display='none';
  const list=document.getElementById('pkg-list');
  list.innerHTML=(packages||[]).map(p=>`
    <div class="pkg" id="p-${p.id}" onclick="pick('${p.id}',${p.price})">
      <div class="pkg-radio"></div>
      <div class="pkg-info"><div class="pkg-name">${p.name}</div><div class="pkg-meta">${p.duration_hours?p.duration_hours+'h':''} ${p.bandwidth_down_mbps?'· '+p.bandwidth_down_mbps+'Mbps':''}</div></div>
      <div class="pkg-price">KES ${parseFloat(p.price).toLocaleString()}</div>
    </div>`).join('');
}
function pick(id,price){sel={id,price};document.querySelectorAll('.pkg').forEach(p=>p.classList.remove('sel'));document.getElementById('p-'+id)?.classList.add('sel');}
async function pay(){
  if(!sel)return msg('Select a package','e');
  const ph=document.getElementById('phone').value.trim();
  if(!ph)return msg('Enter phone number','e');
  const r=await fetch(`${API}/captive/${ISP_ID}/pay`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:ph,package_id:sel.id,amount:sel.price})});
  const j=await r.json();
  msg(r.ok?`MPesa prompt sent to ${ph}.\nEnter PIN to complete. SMS voucher incoming.`:j.error||'Payment failed.',r.ok?'s':'e');
}
async function redeem(){
  const code=document.getElementById('vcode').value.trim().toUpperCase();
  const ph=document.getElementById('vphone').value.trim();
  if(!code)return msg('Enter a voucher code','e');
  const r=await fetch(`${API}/captive/${ISP_ID}/redeem`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code,phone:ph})});
  const j=await r.json();
  const ex=j.expires_at?`\nExpires: ${new Date(j.expires_at).toLocaleString('en-KE')}`:'';
  msg(r.ok?`✅ Connected!\nCode: ${j.username}${ex}${ph?'\nSMS sent to '+ph:''}`:j.error||'Invalid code.',r.ok?'s':'e');
}
function msg(m,t){const e=document.getElementById('msg');e.textContent=m;e.className='msg '+t;e.style.display='block';}
init();
</script>

<!-- Payment spinner widget -->
<div id="rml-spinner-include"></div>
<script>
fetch('/captive/payment-spinner.html').then(r => r.text()).then(html => {
  document.getElementById('rml-spinner-include').innerHTML = html;
  // Re-execute scripts (innerHTML doesn't run them)
  document.querySelectorAll('#rml-spinner-include script').forEach(s => {
    var n = document.createElement('script');
    n.textContent = s.textContent;
    document.body.appendChild(n);
  });
});
</script>

<script>
// Hook into existing pay() flow — wrap fetch responses to show spinner
(function(){
  var origFetch = window.fetch;
  window.fetch = function(url, opts) {
    var prom = origFetch.apply(this, arguments);
    if (typeof url === 'string' && url.indexOf('/pay') > -1 && opts && opts.method === 'POST') {
      prom.then(r => r.clone().json()).then(data => {
        if (data && data.payment_id && typeof rumalinkShowPaymentSpinner === 'function') {
          var body = {};
          try { body = JSON.parse(opts.body || '{}'); } catch(e){}
          var ispId = (typeof ISP_ID !== 'undefined') ? ISP_ID : (location.search.match(/isp=([^&]+)/)||[])[1];
          rumalinkShowPaymentSpinner({
            phone: body.phone,
            amount: data.amount,
            paymentId: data.payment_id,
            statusUrl: '/api/captive/' + ispId + '/payment-status/' + data.payment_id
          });
        }
      }).catch(()=>{});
    }
    return prom;
  };
})();
</script>

<script>
/* RumaLink Captive — Already Paid Login Button */
(function(){
  // Don't double-inject
  if (document.getElementById('rl-already-paid-btn')) return;

  const ispId = (location.search.match(/isp=([^&]+)/)||[])[1];
  if (!ispId) return;

  // Find the page's main container to attach the floating button
  const btn = document.createElement('button');
  btn.id = 'rl-already-paid-btn';
  btn.innerHTML = '🔑 Already Paid? Login';
  btn.style.cssText = 'position:fixed;top:14px;right:14px;background:rgba(0,212,170,.15);border:1px solid rgba(0,212,170,.4);color:#00d4aa;padding:10px 18px;border-radius:8px;font-weight:600;cursor:pointer;font-size:.88rem;z-index:9998;backdrop-filter:blur(6px);font-family:sans-serif;box-shadow:0 4px 12px rgba(0,0,0,.3)';
  btn.onclick = openLoginModal;
  document.body.appendChild(btn);

  function openLoginModal() {
    let modal = document.getElementById('rl-login-modal');
    if (modal) { modal.style.display='flex'; return; }
    modal = document.createElement('div');
    modal.id = 'rl-login-modal';
    modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:99998;display:flex;align-items:center;justify-content:center;padding:20px;font-family:sans-serif';
    modal.innerHTML = `
      <div style="background:#0d1530;border:1px solid rgba(0,212,170,.2);border-radius:18px;padding:28px 24px;max-width:380px;width:100%;color:#fff">
        <h2 style="margin:0 0 6px;font-size:1.2rem">🔑 Reconnect to WiFi</h2>
        <p style="margin:0 0 18px;color:rgba(255,255,255,.7);font-size:.86rem">Enter the voucher code you received after paying. If your session hasn't expired, you'll be reconnected instantly.</p>
        <input type="text" id="rl-login-code" placeholder="WIFI-1234-XYZ" style="width:100%;padding:12px 14px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.15);border-radius:8px;color:#fff;font-size:1.05rem;margin-bottom:10px;box-sizing:border-box;font-family:monospace;letter-spacing:2px;text-transform:uppercase"/>
        <input type="tel" id="rl-login-phone" placeholder="Phone (optional - 07XX or 254XX)" style="width:100%;padding:12px 14px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.15);border-radius:8px;color:#fff;font-size:.92rem;margin-bottom:16px;box-sizing:border-box"/>
        <div id="rl-login-msg" style="display:none;padding:10px 14px;border-radius:8px;font-size:.84rem;margin-bottom:12px"></div>
        <div style="display:flex;gap:8px">
          <button id="rl-login-go" style="flex:1;background:#00d4aa;color:#0d1530;border:none;border-radius:8px;padding:12px;font-weight:700;cursor:pointer;font-size:.96rem">Login</button>
          <button id="rl-login-close" style="background:transparent;border:1px solid rgba(255,255,255,.2);color:rgba(255,255,255,.7);border-radius:8px;padding:12px 20px;cursor:pointer">Cancel</button>
        </div>
      </div>`;
    document.body.appendChild(modal);
    modal.addEventListener('click', e => { if (e.target === modal) modal.style.display='none'; });
    document.getElementById('rl-login-close').onclick = () => modal.style.display='none';
    document.getElementById('rl-login-go').onclick = doLogin;
    document.getElementById('rl-login-code').focus();
  }

  function getMac(){
    const p = new URLSearchParams(location.search);
    return p.get('mac') || p.get('client-mac') || '';
  }

  async function doLogin() {
    const code = document.getElementById('rl-login-code').value.trim().toUpperCase();
    const phone = document.getElementById('rl-login-phone').value.trim();
    const msg = document.getElementById('rl-login-msg');
    const btn = document.getElementById('rl-login-go');
    function show(t, ok) {
      msg.textContent = t;
      msg.style.cssText = 'display:block;padding:10px 14px;border-radius:8px;font-size:.84rem;margin-bottom:12px;'
        + (ok ? 'background:rgba(0,212,170,.15);color:#00d4aa' : 'background:rgba(231,76,60,.15);color:#e74c3c');
    }
    if (!code) { show('Please enter your voucher code', false); return; }
    btn.disabled = true; btn.textContent = 'Logging in…';
    try {
      const r = await fetch('/api/captive/'+ispId+'/login', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ username: code, password: phone, mac: getMac() })
      });
      const d = await r.json();
      if (!r.ok) throw new Error(d.error || 'Login failed');
      show('✅ Connected! Refreshing…', true);
      // Try to POST to MikroTik link-login-only to complete the hotspot session
      const loginUrl = (location.search.match(/loginurl=([^&]+)/)||[])[1];
      if (loginUrl) {
        const f = document.createElement('form');
        f.method = 'POST'; f.action = decodeURIComponent(loginUrl);
        ['username','password','dst'].forEach((n,i)=>{ const x=document.createElement('input'); x.type='hidden'; x.name=n; x.value = [code, phone||code, ''][i]; f.appendChild(x); });
        document.body.appendChild(f);
        setTimeout(()=>f.submit(), 1200);
      } else {
        setTimeout(()=>location.reload(), 1500);
      }
    } catch(e) {
      show('❌ ' + e.message, false);
      btn.disabled = false; btn.textContent = 'Login';
    }
  }
})();
</script>


<script>
/* RumaLink — Auto-dismiss STK push notifications */
(function(){
  // Patterns that identify ephemeral payment-initiation messages that should auto-clear
  const dismissPatterns = [
    /STK Push sent/i,
    /MPesa prompt sent/i,
    /M-Pesa prompt sent/i,
    /Payment ID:/i,
    /Enter PIN to complete/i,
    /Payment Requested/i,
    /SMS voucher incoming/i
  ];

  function shouldDismiss(text) {
    return dismissPatterns.some(p => p.test(text));
  }

  // Observe DOM and auto-dismiss matching elements after 6 seconds
  const observer = new MutationObserver(mutations => {
    mutations.forEach(m => {
      m.addedNodes.forEach(node => {
        if (node.nodeType !== 1) return;
        // Check node + descendants
        const candidates = [node, ...node.querySelectorAll?.('*') || []];
        candidates.forEach(el => {
          if (!el.textContent) return;
          if (shouldDismiss(el.textContent)) {
            // If this is a small status banner (not the whole modal), schedule removal
            const tag = el.tagName?.toLowerCase();
            if (['div','p','span','section','article'].includes(tag) && el.textContent.length < 300) {
              if (!el.dataset.rlDismissed) {
                el.dataset.rlDismissed = '1';
                setTimeout(() => {
                  // Fade out smoothly
                  el.style.transition = 'opacity .4s';
                  el.style.opacity = '0';
                  setTimeout(() => {
                    // Only remove if still a banner (not the spinner itself)
                    if (el.parentNode && !el.closest('.rml-spinner-overlay')) {
                      el.style.display = 'none';
                    }
                  }, 400);
                }, 6000);
              }
            }
          }
        });
      });
    });
  });
  observer.observe(document.body, { childList: true, subtree: true });

  // Also: when spinner shows success/failure, clear any sticky payment banner immediately
  window.addEventListener('storage', () => {});  // touch to trigger
  const origShow = window.rumalinkShowPaymentSpinner;
  // Hook spinner success/fail to also nuke any sticky banners
  document.addEventListener('click', function(e){
    // When user clicks Continue or Try Again on spinner, also dismiss any banner
    if (e.target?.classList?.contains('rml-spin-action')) {
      document.querySelectorAll('[data-rl-dismissed]').forEach(el => el.style.display='none');
    }
  });

  console.log('[RumaLink] Notification auto-dismiss active');
})();
</script>

</body>
</html>
