<body>
<div class="nav">
  <h1>RumaLink</h1>
  <a href="dashboard.html">← Dashboard</a>
  <span style="color:#8899bb;font-size:.85rem">/</span>
  <span style="color:#f0f4ff;font-size:.85rem">MikroTik Device</span>
  <div class="right">
    <button class="refresh" onclick="loadDevice()">🔄 Refresh</button>
    <button id="btn-winbox" class="winbox" onclick="openWinbox()" style="display:none">🔌 Remote Winbox</button>
    <button class="danger" onclick="confirmDelete()">🗑 Delete</button>
  </div>
</div>

<div class="container">
  <div id="content"><div class="loading">Loading device details…</div></div>
</div>

<script>
const params = new URLSearchParams(location.search);
const deviceId = params.get('id');
const token = localStorage.getItem('rl_token') || '';
let device = null;
let bwTimer = null;

if (!deviceId) {
  document.getElementById('content').innerHTML = '<div class="loading">Missing device id. <a href="dashboard.html" style="color:#00d4aa">Back to dashboard</a></div>';
}

async function api(path, opts = {}) {
  const res = await fetch('/api' + path, {
    ...opts,
    headers: { 'Content-Type':'application/json', 'Authorization':'Bearer '+token, ...(opts.headers||{}) }
  });
  if (res.status === 401) { location.href = '/isp/login.html'; return; }
  const j = await res.json();
  if (!res.ok) throw new Error(j.error || 'API error');
  return j;
}

function fmtBytes(n) {
  n = Number(n) || 0;
  if (n < 1024) return n + ' B';
  if (n < 1024*1024) return (n/1024).toFixed(1) + ' KB';
  if (n < 1024*1024*1024) return (n/1024/1024).toFixed(1) + ' MB';
  return (n/1024/1024/1024).toFixed(2) + ' GB';
}

function fmtBps(bps) {
  bps = Number(bps) || 0;
  if (bps < 1000) return bps + ' bps';
  if (bps < 1e6) return (bps/1000).toFixed(1) + ' Kbps';
  if (bps < 1e9) return (bps/1e6).toFixed(2) + ' Mbps';
  return (bps/1e9).toFixed(2) + ' Gbps';
}

function fmtDuration(sec) {
  sec = Number(sec) || 0;
  if (sec < 60) return sec + 's';
  const m = Math.floor(sec/60), h = Math.floor(m/60), d = Math.floor(h/24);
  if (d > 0) return `${d}d ${h%24}h ${m%60}m`;
  if (h > 0) return `${h}h ${m%60}m`;
  return `${m}m`;
}

function fmtAgo(iso) {
  if (!iso) return '—';
  const sec = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
  if (sec < 60) return sec + 's ago';
  if (sec < 3600) return Math.floor(sec/60) + 'm ago';
  if (sec < 86400) return Math.floor(sec/3600) + 'h ago';
  return Math.floor(sec/86400) + 'd ago';
}

function pct(used, total) {
  if (!total) return 0;
  return Math.round(used/total*100);
}

function esc(s) { return String(s||'').replace(/[<>&"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'})[c]); }

async function loadDevice() {
  try {
    const d = await api('/nas/' + encodeURIComponent(deviceId));
    device = d.device;
    render();
    startBwPolling();
    startLinkStatusPolling();
    // v62.95: auto-load mwan config so it's ready when user switches tabs
    loadMwanConfig();
  } catch (e) {
    document.getElementById('content').innerHTML = `<div class="loading">Failed to load device: ${esc(e.message)}<br><a href="dashboard.html" style="color:#00d4aa">Back to dashboard</a></div>`;
  }
}

function render() {
  const dev = device;
  const status = dev.is_online ? 'online' : dev.is_provisioned ? 'offline' : 'pending';
  const statusLabel = dev.is_online ? '● Online' : dev.is_provisioned ? '● Offline' : '⏳ Pending Provisioning';
  
  // Show winbox button if URL exists
  if (dev.remote_winbox_url) {
    document.getElementById('btn-winbox').style.display = '';
  }
  
  // Parse bridge_ports (may be JSON or comma-separated string)
  let bridgePorts = dev.bridge_ports || dev.bridged_ports || '';
  if (Array.isArray(bridgePorts)) bridgePorts = bridgePorts.join(', ');
  
  // CPU / RAM / disk gauges
  const cpu = Number(dev.cpu_load) || 0;

let apiPwdRevealed = false;
function revealApiPassword() {
  apiPwdRevealed = !apiPwdRevealed;
  const el = document.getElementById('api-pwd-display');
  const btn = document.getElementById('reveal-btn');
  if (apiPwdRevealed) {
    el.textContent = device?.mikrotik_api_password || '—';
    el.style.color = '#00d4aa';
    btn.textContent = 'Hide';
  } else {
    el.textContent = '••••••••••••';
    el.style.color = '#8899bb';
    btn.textContent = 'Reveal';
  }
}

function copyText(t) {
  navigator.clipboard.writeText(t).then(() => {
    // simple inline feedback
    const btns = document.querySelectorAll('.copy-btn');
    btns.forEach(b => { if (b.textContent === 'Copy') { const o = b.textContent; b.textContent = '✓ Copied'; setTimeout(() => b.textContent = o, 1200); } });
  });
}

async function fetchBandwidth() {
  try {
    const d = await api('/nas/' + encodeURIComponent(deviceId) + '/bandwidth');
    const err = document.getElementById('bw-error');
    if (d.error) {
      err.style.display = '';
      err.textContent = 'Live bandwidth unavailable: ' + d.error;
      return;
    }
    err.style.display = 'none';
    if (d.lan) {
      document.getElementById('bw-lan-name').textContent = d.lan.iface || '—';
      // v62.86: use semantic down_bps/up_bps (down = router → clients, up = clients → router)
      document.getElementById('bw-lan-rx').textContent = fmtBps(d.lan.down_bps || 0);
      document.getElementById('bw-lan-tx').textContent = fmtBps(d.lan.up_bps || 0);
    }
  } catch (e) {
    const err = document.getElementById('bw-error');
    if (err) { err.style.display = ''; err.textContent = 'Live bandwidth error: ' + e.message; }
  }
}

function startBwPolling() {
  if (bwTimer) clearInterval(bwTimer);
  if (!device?.is_online) return;
  fetchBandwidth();
  bwTimer = setInterval(fetchBandwidth, 3000);
}

window.addEventListener('beforeunload', () => { if (bwTimer) clearInterval(bwTimer); });

async function regenerateProvisioningToken() {

function renderLinkStatus(d) {

function setMwanMode(mode) {
  mwanCurrentMode = mode;
  /* RL_MODE_VIS: repaint the LB panels immediately on mode switch */
  try { rlPaintLbSplit(); } catch(_e){}
  try { if (typeof rlLoadConns === 'function') rlLoadConns(); } catch(_e){}
  document.querySelectorAll('.mode-card').forEach(c => c.classList.toggle('active', c.dataset.mode === mode));

  // Sync each link's role flags to the chosen mode so the SAVED config matches the tab.
  // Failover Only -> every link failover; Load Balancing -> every link LB; Both -> per-link.
  (mwanLinks || []).forEach((l, i) => {
    if (mode === 'load_balance') { l.in_load_balance = true; l.is_failover = false; l.failover_priority = null; }
    else if (mode === 'failover') { l.in_load_balance = false; l.is_failover = true; if (!l.failover_priority) l.failover_priority = i + 1; }
    l.role = l.in_load_balance ? 'load_balance' : (l.is_failover ? 'failover_primary' : 'dedicated');
  });

  const showLinks    = mode !== 'none';
  const showFailover = mode === 'failover' || mode === 'both';
  const showLB       = mode === 'load_balance' || mode === 'both';
  const showPolicies = showLB;  // policies only matter for load-balance/both

let mwanLinkStatuses = {};

async function refreshLinkStatus() {
  if (!mwanCurrentMode || mwanCurrentMode === 'none') return;
  if (!mwanLinks || !mwanLinks.length) return;
  // Skip if not yet saved (links have null IDs)
  if (mwanLinks.some(l => !l.id)) return;
  
  const btn = document.getElementById('mwan-status-refresh-btn');
  if (btn) { btn.disabled = true; btn.innerHTML = '⟳ Refreshing…'; }
  try {
    const d = await api('/nas/' + encodeURIComponent(deviceId) + '/multi-wan/link-status');
    if (d && d.statuses) {
      mwanLinkStatuses = {};
      d.statuses.forEach(s => { mwanLinkStatuses[s.id] = s; });
      try { rlPaintLbSplit(); } catch (e) {}   /* RL_LB_LIVE: repaint the split with fresh byte counts */
      try { if (!rlConnsTimer) rlStartConns(); } catch (e) {}
      // Re-render link cards to show updated pills
      renderWanLinks();
    }
  } catch (e) {
    console.warn('[mwan link-status]', e.message);
  } finally {
    if (btn) { btn.disabled = false; btn.innerHTML = '↻ Refresh'; }
  }
}

function startLinkStatusPollingMwan() {
  stopLinkStatusPollingMwan();
  if (mwanCurrentMode === 'none' || !mwanLinks || !mwanLinks.length) return;
  if (mwanLinks.some(l => !l.id)) return; // not saved yet
  refreshLinkStatus();
  mwanLinkStatusTimer = setInterval(refreshLinkStatus, 20000); // every 20s

function renderLinkStatusPill(linkId) {

  else if (s.status === 'standby')    { cls = 'ready';   icon = '◐'; label = s.status_label || 'Standby'; }

function renderQualityChip(s){ /* RL_QUALITY_DASH */
  if (s == null || (s.latency_ms == null && s.jitter_ms == null && s.loss_pct == null)) return '';
  var lat = (s.latency_ms != null) ? (Math.round(s.latency_ms*10)/10 + 'ms') : '\u2014';
  var jit = (s.jitter_ms != null) ? (Math.round(s.jitter_ms*10)/10 + 'ms') : '\u2014';
  var loss = (s.loss_pct != null) ? (s.loss_pct + '%') : '\u2014';
  var state = s.quality_parked ? 'parked' : (s.quality_state || 'good');
  var badge, color, bg;
  if (state === 'parked' || state === 'degraded') { badge = '\uD83D\uDD34 Degraded \u2014 on backup'; color = '#e74c3c'; bg = 'rgba(231,76,60,.12)'; }
  else if (state === 'degrading') { badge = '\uD83D\uDFE1 Degrading'; color = '#f39c12'; bg = 'rgba(243,156,18,.12)'; }
  else { badge = '\uD83D\uDFE2 Good'; color = '#00d4aa'; bg = 'rgba(0,212,170,.12)'; }
  return '<span style="display:inline-flex;gap:10px;align-items:center;padding:2px 8px;border-radius:6px;background:'+bg+';color:'+color+'">'

    + '<strong>'+badge+'</strong></span>';
}
/* RL_CONNS_UI: live connections, grouped by the WAN each one actually took.
   The connection-mark (rl_conn_wanN) is stamped by PCC when the connection is established, so
   this is not an estimate — it is where the traffic genuinely went. If the hash is honouring
   your weights, the flow counts here will match them. */
let rlConnsTimer = null;

async function rlLoadConns() {
  /* RL_MODE_VIS: Live Connections is LB content — in failover-only mode, don't poll the
     router for connection data and keep the panel empty. */
  if (mwanCurrentMode === 'failover') { try { rlRenderConns({}); } catch(_e){} return; }
  const box = document.getElementById('rl-conns');
  if (!box) return;
  try {
    const d = await api('/nas/' + encodeURIComponent(deviceId) + '/connections');
    rlRenderConns(d);
  } catch (e) {
    box.innerHTML = '<div style="color:#7788aa;font-size:.75rem;padding:10px">Could not read connections from the router.</div>';
  }
}

function rlRenderConns(d) {
  const box = document.getElementById('rl-conns');
  if (!box) return;
  const wans = (d.wans || []).filter(function(w){ return w.in_lb; });
  const conns = d.conns || [];

  if (!wans.length) { box.innerHTML = ''; return; }

  const totalFlows = wans.reduce(function(a,w){ return a + w.flows; }, 0);
  const cols = ['#00d4aa','#5eb3ff','#f0a020','#c678dd'];

  // Per-WAN summary cards
  const cards = wans.map(function(w, i) {
    const pct = totalFlows ? (w.flows / totalFlows) * 100 : 0;
    const c = cols[i % 4];
    return '<div style="flex:1;background:' + c + '14;border:1px solid ' + c + '40;border-radius:8px;padding:10px 12px">' +
      '<div style="color:' + c + ';font-weight:700;font-size:.76rem">WAN' + w.position + ' · ' + esc(w.interface) + '</div>' +
      '<div style="color:#f0f4ff;font-size:1.25rem;font-weight:700;margin:3px 0">' + w.flows +
        ' <span style="font-size:.68rem;color:#8899bb;font-weight:400">flows · ' + pct.toFixed(0) + '%</span></div>' +
      '<div style="font-size:.68rem;color:' + c + '">' + rlFmtBytes(w.bytes) + ' · set ' + (w.weight || 0) + '%</div>' +
    '</div>';
  }).join('');

  // Is PCC obeying the weights?
  let verdict = '';
  if (totalFlows >= 6) {
    const wTot = wans.reduce(function(a,w){ return a + Number(w.weight||0); }, 0);
    let worst = 0;
    wans.forEach(function(w){
      const act = (w.flows / totalFlows) * 100;
      const set = wTot ? (Number(w.weight||0) / wTot) * 100 : 0;
      worst = Math.max(worst, Math.abs(act - set));
    });
    verdict = worst <= 15
      ? '<div style="background:rgba(0,212,170,.07);border-left:3px solid #00d4aa;border-radius:4px;padding:7px 11px;font-size:.72rem;margin:10px 0"><strong style="color:#00d4aa">PCC is obeying your weights</strong> — live flows are within ' + worst.toFixed(0) + '% of the split you set.</div>'
      : '<div style="background:rgba(240,160,32,.07);border-left:3px solid #f0a020;border-radius:4px;padding:7px 11px;font-size:.72rem;margin:10px 0"><strong style="color:#f0a020">Flows are ' + worst.toFixed(0) + '% off your weights.</strong> PCC hashes per connection, so small samples skew — but a persistent gap on a busy network means the hash is not distributing evenly.</div>';
  } else if (totalFlows > 0) {
    verdict = '<div style="color:#7788aa;font-size:.7rem;margin:10px 0">Only ' + totalFlows + ' active flow' + (totalFlows===1?'':'s') + ' — too few to judge the split. It needs real customer traffic.</div>';
  }

  // The table
  let table;
  if (!conns.length) {
    table = '<div style="text-align:center;padding:22px;color:#7788aa;font-size:.76rem">' +
      '<div style="font-size:1.6rem;margin-bottom:6px;opacity:.4">◌</div>' +
      'No customer connections right now.<br>' +
      '<span style="font-size:.7rem">Traffic appears here as soon as someone browses. The router\'s own traffic (tunnel, DNS, health probes) is excluded — it would distort the split.</span></div>';
  } else {
    const rows = conns.map(function(c) {
      const wc = cols[(c.wan - 1) % 4];
      const svc = c.service
        ? '<span style="color:' + c.color + '">' + c.icon + '</span> ' + esc(c.service) +
          ' <span style="color:#7788aa;font-family:monospace;font-size:.68rem">' + esc(c.dst) + '</span>'
        : '<span style="color:#7788aa;font-family:monospace">' + esc(c.dst) + (c.port ? ':' + esc(c.port) : '') + '</span>';
      return '<tr style="border-bottom:1px solid rgba(136,153,187,.07)">' +
        '<td style="padding:7px 4px;font-family:monospace;color:#f0f4ff;font-size:.7rem">' + esc(c.src) + '</td>' +
        '<td style="padding:7px 4px">' + svc + '</td>' +
        '<td style="padding:7px 4px"><span style="color:' + wc + ';font-weight:600">WAN' + c.wan + '</span></td>' +
        '<td style="padding:7px 4px;text-align:right;color:#f0f4ff">' + rlFmtBytes(c.bytes) + '</td></tr>';
    }).join('');
    table = '<table style="width:100%;border-collapse:collapse;font-size:.72rem">' +
      '<tr style="color:#7788aa;text-align:left;border-bottom:1px solid rgba(136,153,187,.2)">' +
        '<th style="padding:6px 4px;font-weight:600">Client</th>' +
        '<th style="padding:6px 4px;font-weight:600">Destination</th>' +
        '<th style="padding:6px 4px;font-weight:600">Via</th>' +
        '<th style="padding:6px 4px;font-weight:600;text-align:right">Data</th></tr>' + rows + '</table>';
  }

  box.innerHTML =
    '<div style="background:rgba(20,26,40,.55);border:1px solid rgba(136,153,187,.18);border-radius:10px;padding:14px;margin:0 0 16px">' +
      '<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:11px">' +
        '<span style="color:#f0f4ff;font-weight:700;font-size:.86rem">🔴 Live Connections</span>' +
        '<span style="color:#7788aa;font-size:.7rem">refreshing every 5s · ' + (d.total || 0) + ' active</span></div>' +
      '<div style="display:flex;gap:10px;margin-bottom:4px">' + cards + '</div>' +
      verdict + table +
      '<div style="color:#7788aa;font-size:.65rem;margin-top:9px;border-top:1px solid rgba(136,153,187,.12);padding-top:7px">' +
        'The WAN column is read from the connection mark PCC stamped on each flow — this is where traffic actually went, not an estimate. Service names are inferred from destination IP ownership; everything is HTTPS, so CDN-hosted apps may show as their CDN.</div>' +
    '</div>';
}

/* RL_PROBE_UI: the honest internet verdict.
   The old line read s.external_ping_ok — an ICMP flag. That is exactly what reported
   "70ms, 0% loss, Good" while no site would load: the ISP's transit was dead but the router
   still answered pings. This renders what the fetch probe actually found: whether real
   content (DNS -> TCP -> TLS -> HTTP) was retrieved THROUGH THIS WAN. */
/* RL_BYTES_UI: data carried by this link. On a BACKUP this is the number that matters —
   backup uplinks are often metered, and a failover you did not notice can run up a bill. */
/* RL_LB_SPLIT: the traffic split across load-balanced links.
   Configured weight is an INTENTION; PCC hashes by connection, so a handful of heavy flows can
   pull a 50/50 config to 70/30. Showing configured-vs-ACTUAL is what makes this diagnostic
   rather than decorative — a persistent skew means the hash is not distributing your traffic. */

function fmtBytes(b) {
  b = Number(b||0);
  var u = ['B','KB','MB','GB','TB'], i = 0;
  while (b >= 1024 && i < u.length-1) { b /= 1024; i++; }
  return b.toFixed(b < 10 && i > 0 ? 1 : 0) + ' ' + u[i];
}

function renderBytesCarried(s) {
  const b = Number(s.bytes_carried || 0);
  if (!b) return '';
  const u = ['B','KB','MB','GB','TB']; let i = 0, v = b;
  while (v >= 1024 && i < u.length - 1) { v /= 1024; i++; }
  return '<span style="color:#8899bb">📊 <strong style="color:#f0f4ff">' +
         v.toFixed(v < 10 && i > 0 ? 1 : 0) + ' ' + u[i] + '</strong> carried</span>';
}

/* RL_LB_LIVE: the live traffic split across load-balanced links.
   The configured weight is an INTENTION. PCC hashes by connection, so a handful of heavy flows
   (one big download, a video stream) can pull a 50/50 config to 70/30. Showing configured vs
   ACTUAL is what makes this diagnostic rather than decorative: a persistent skew means the hash
   is not distributing your traffic the way you asked. */
function rlFmtBytes(b) {
  b = Number(b || 0);
  var u = ['B','KB','MB','GB','TB'], i = 0;
  while (b >= 1024 && i < u.length - 1) { b /= 1024; i++; }
  return b.toFixed(b < 10 && i > 0 ? 1 : 0) + ' ' + u[i];
}

function renderLbSplit() {
  // RL_LB_FIX: mwanLinkStatuses is declared with `let` (line ~934), and a `let` does NOT
  // attach to window. Reading window.mwanLinkStatuses therefore returned undefined, this fell
  // back to {}, found no links, and returned '' on every single call — which is why the visual
  // never appeared no matter how many repaint hooks were added.
  var st = (typeof mwanLinkStatuses !== 'undefined' && mwanLinkStatuses) ? mwanLinkStatuses : {};
  var lbs = Object.keys(st).map(function(k){ return st[k]; })
              .filter(function(x){ return x && x.in_load_balance; })
              .sort(function(a,b){ return (a.position||0) - (b.position||0); });
  if (lbs.length < 2) return '';

  var total = lbs.reduce(function(a,x){ return a + Number(x.bytes_carried || 0); }, 0);
  if (!total) return '';
  var wTotal = lbs.reduce(function(a,x){ return a + Number(x.lb_weight || 0); }, 0);
  var cols = ['#00d4aa','#5eb3ff','#f0a020','#c678dd'];

  var bar = lbs.map(function(x, i) {
    var pct = (Number(x.bytes_carried || 0) / total) * 100;
    if (pct < 0.4) return '';
    return '<div style="width:' + pct.toFixed(1) + '%;background:' + cols[i % 4] +
      ';display:flex;align-items:center;justify-content:center;color:#04121a;font-weight:700;font-size:.72rem">' +
      (pct >= 14 ? 'WAN' + x.position + ' · ' + pct.toFixed(0) + '%' : '') + '</div>';
  }).join('');

  var maxSkew = 0;
  var rows = lbs.map(function(x, i) {
    var b = Number(x.bytes_carried || 0);
    var pct = (b / total) * 100;
    var wPct = wTotal ? (Number(x.lb_weight || 0) / wTotal) * 100 : 0;
    var skew = Math.abs(pct - wPct);
    if (skew > maxSkew) maxSkew = skew;
    var health = x.probe_verdict === 'good' ? '<span style="color:#00d4aa">✓</span>'
               : x.probe_verdict === 'slow' ? '<span style="color:#f0a020">slow</span>'
               : x.probe_verdict === 'down' ? '<span style="color:#e74c3c">✗</span>' : '';
    return '<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-size:.76rem;border-bottom:1px solid rgba(136,153,187,.08)">' +
      '<span style="color:' + cols[i % 4] + ';font-weight:600">● WAN' + x.position + ' ' +
        esc(x.interface || '') + ' ' + health + '</span>' +
      '<span style="color:#8899bb"><strong style="color:#f0f4ff">' + rlFmtBytes(b) + '</strong> · ' +
        pct.toFixed(0) + '% <span style="color:#7788aa">(set ' + wPct.toFixed(0) + '%)</span></span>' +
    '</div>';
  }).join('');

  var note = maxSkew > 20
    ? '<div style="color:#f0a020;font-size:.7rem;margin-top:7px">⚠ Split is ' + maxSkew.toFixed(0) +
      '% off the configured weights. PCC hashes by connection, so a few heavy flows can skew it — but a persistent gap means traffic is not distributing as set.</div>'
    : '<div style="color:#7788aa;font-size:.68rem;margin-top:7px">Traffic is distributing close to the configured weights.</div>';

  var month = lbs[0] && lbs[0].bytes_month_start
    ? new Date(lbs[0].bytes_month_start).toLocaleDateString(undefined, { month: 'long' })
    : 'This month';

  return '<div style="background:rgba(20,26,40,.55);border:1px solid rgba(136,153,187,.18);border-radius:10px;padding:14px;margin:0 0 16px">' +
    '<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px">' +
      '<span style="color:#f0f4ff;font-weight:700;font-size:.86rem">⚖️ Live Traffic Split</span>' +
      '<span style="color:#7788aa;font-size:.7rem">' + esc(month) + ' · resets 1st, 00:00</span>' +
    '</div>' +
    '<div style="height:30px;display:flex;border-radius:6px;overflow:hidden;margin-bottom:10px;border:1px solid rgba(136,153,187,.15)">' + bar + '</div>' +
    rows + note +
  '</div>';
}

function renderInternetVerdict(s) {
  const v = s.probe_verdict;
  if (!v) {
    // No probe data yet — fall back to the old flag, but say so rather than implying certainty.
    return s.external_ping_ok
      ? '<span style="color:#8899bb">· Internet: ping only</span>'
      : '<span style="color:#e74c3c">· Internet ✗</span>';
  }
  const ms = s.fetch_ms ? (s.fetch_ms / 1000).toFixed(1) + 's' : null;
  const stage = s.probe_stage || '';
  const fails = Number(s.consec_fetch_fail || 0);

  if (v === 'good') {
    return '<span style="color:#00d4aa">· Internet ✓' + (ms ? ' <span style="color:#6f8">fetched ' + ms + '</span>' : '') + '</span>';
  }
  if (v === 'slow') {
    return '<span style="color:#f0a020">· Internet ✓ <strong>slow</strong>' + (ms ? ' — fetched ' + ms : '') +
           '<span style="color:#8899bb"> (congested)</span></span>';
  }
  if (v === 'suspect') {
    // The critical state: real traffic is failing while ICMP still looks perfect.
    return '<span style="color:#f0a020">· Internet ⚠ <strong>verifying ' + fails + '/3</strong>' +
           '<span style="color:#8899bb"> — fetch failing at ' + esc(stage) + ', ping still OK</span></span>';
  }
  if (v === 'down') {
    let why = stage === 'no-address' ? 'no IP on interface'
            : stage === 'no-gateway' ? 'no gateway'
            : stage === 'timeout'    ? 'no response'
            : stage === 'dns'        ? 'DNS failed'
            : stage === 'tcp'        ? 'TCP refused'
            : stage === 'tls'        ? 'TLS failed'
            : ('failed at ' + stage);
    // If ping still answers while the fetch cannot, say so plainly — that is the whole point.
    const lying = s.external_ping_ok ? ' <span style="color:#f0a020">(ping OK — ICMP lying)</span>' : '';
    return '<span style="color:#e74c3c">· Internet ✗ <strong>' + esc(why) + '</strong>' + lying + '</span>';
  }
  if (v === 'skipped') {
    return '<span style="color:#8899bb">· Internet: router busy, ping only</span>';
  }
  return '<span style="color:#8899bb">· Internet: ' + esc(v) + '</span>';
}

function addWanLink() {
  const usedIfaces = mwanLinks.map(l => l.interface);
  const freeIface = mwanInterfaces.find(i => !usedIfaces.includes(i)) || 'ether' + (mwanLinks.length + 1);
  mwanLinks.push({
    id: null,
    position: mwanLinks.length + 1,
    name: 'Link ' + (mwanLinks.length + 1),
    interface: freeIface,
    gateway: '',
    ping_target: '8.8.8.8',
    role: 'load_balance',
    in_load_balance: mwanCurrentMode !== 'failover',
    is_failover: mwanCurrentMode === 'failover',
    failover_priority: mwanCurrentMode === 'failover' ? (mwanLinks.length + 1) : null,
    lb_weight: 50,
    enabled: true
  });
  renderWanLinks();
  renderWanPolicies(); // policies depend on link list
}

function updateLinkField(idx, field, value) {
  if (mwanLinks[idx]) mwanLinks[idx][field] = value;
}

function toggleLinkRole(idx, field, checked) {
  if (!mwanLinks[idx]) return;
  mwanLinks[idx][field] = checked;
  if (field === 'is_failover') {
    if (checked && !mwanLinks[idx].failover_priority) mwanLinks[idx].failover_priority = idx + 1;
    if (!checked) mwanLinks[idx].failover_priority = null;
  }
  mwanLinks[idx].role = mwanLinks[idx].in_load_balance ? 'load_balance' : (mwanLinks[idx].is_failover ? 'failover_primary' : 'dedicated');
  renderWanLinks();
  renderWanPolicies();
}

function updateLinkRole(idx, value) {
  if (!mwanLinks[idx]) return;
  mwanLinks[idx].role = value;
  renderWanLinks();
  renderWanPolicies();
}

function updateLinkWeight(idx, value) {
  if (!mwanLinks[idx]) return;
  mwanLinks[idx].lb_weight = parseInt(value);
  const el = document.getElementById('lb-weight-val-' + idx);
  if (el) el.textContent = value + '%';
}

function moveLink(idx, dir) {
  const target = idx + dir;
  if (target < 0 || target >= mwanLinks.length) return;
  [mwanLinks[idx], mwanLinks[target]] = [mwanLinks[target], mwanLinks[idx]];
  // Re-number positions
  mwanLinks.forEach((l, i) => l.position = i + 1);
  renderWanLinks();
  renderWanPolicies();
}

function deleteLink(idx) {
  if (!confirm('Remove link "' + (mwanLinks[idx].name || 'WAN ' + (idx+1)) + '"?')) return;
  const removedId = mwanLinks[idx].id;
  mwanLinks.splice(idx, 1);
  mwanLinks.forEach((l, i) => l.position = i + 1);
  // Also remove any policies pointing to this link
  if (removedId) {
    mwanPolicies = mwanPolicies.filter(p => p.target_link_id !== removedId);
    mwanPolicies.forEach(p => {
      if (Array.isArray(p.target_link_ids)) p.target_link_ids = p.target_link_ids.filter(id => id !== removedId);
    });
  }
  renderWanLinks();
  renderWanPolicies();
}

function renderWanPolicies() {
  const list = document.getElementById('mwan-policies-list');
  if (!list) return;
  list.innerHTML = '';

  // Add user policies
  mwanPolicies.forEach((p, idx) => {
    list.appendChild(renderPolicyRow(p, idx));
  });

  // Always-present default catch-all (display-only at bottom)
  const defaultDiv = document.createElement('div');
  defaultDiv.className = 'policy-row is-default';
  const lbLinks = mwanLinks.filter(l => l.in_load_balance === true || l.role === 'load_balance');
  const defaultText = lbLinks.length
    ? `<strong>Load balance pool:</strong> ${lbLinks.map(l => esc(l.name || l.interface)).join(', ')}`
    : 'No load-balance links — please add at least one Load Balance link above';
  defaultDiv.innerHTML = `
    <span class="policy-num" title="Default rule (lowest priority)">∞</span>
    <span class="policy-text"><strong>Default (catch-all):</strong></span>
    <span class="policy-text">${defaultText}</span>
    <span class="policy-arrow">→</span>
    <span style="color:#bb86fc;font-size:.78rem;font-weight:600">Always last</span>
  `;
  list.appendChild(defaultDiv);
}

function renderPolicyRow(p, idx) {
  const div = document.createElement('div');
  div.className = 'policy-row';

  // Match label
  let matchLabel = '';
  let matchValueLabel = '';
  if (p.match_type === 'all_pppoe') matchLabel = 'All PPPoE users';
  else if (p.match_type === 'all_hotspot') matchLabel = 'All Hotspot users';
  else if (p.match_type === 'pppoe_package') {
    const pkg = mwanPppoePackages.find(x => x.id === p.match_value);
    matchLabel = 'PPPoE package';
    matchValueLabel = pkg ? pkg.name : '(missing)';
  }
  else if (p.match_type === 'hotspot_package') {
    const pkg = mwanHotspotPackages.find(x => x.id === p.match_value);
    matchLabel = 'Hotspot package';
    matchValueLabel = pkg ? pkg.name : '(missing)';
  }
  else if (p.match_type === 'pppoe_subscriber') {
    const sub = mwanPppoeSubscribers.find(x => x.id === p.match_value);
    matchLabel = 'PPPoE subscriber';
    matchValueLabel = sub ? sub.username : '(missing)';
  }

  // Action label
  let actionLabel = '';
  if (p.action_type === 'use_link') {
    const link = mwanLinks.find(l => l.id === p.target_link_id);
    actionLabel = link ? `Use <strong>${esc(link.name || link.interface)}</strong>` : '(unset)';
  } else if (p.action_type === 'load_balance_pool') {
    const linkNames = (p.target_link_ids || [])
      .map(id => mwanLinks.find(l => l.id === id))
      .filter(Boolean)
      .map(l => esc(l.name || l.interface));
    actionLabel = linkNames.length ? `Load balance: ${linkNames.join(', ')}` : '(no links selected)';
  }

  div.innerHTML = `
    <span class="policy-num">${idx + 1}</span>
    <span class="policy-text">
      <strong>${esc(p.name || 'Unnamed policy')}</strong>
      <div style="color:#8899bb;font-size:.75rem;margin-top:2px">${esc(matchLabel)}${matchValueLabel ? ': <span style="color:#f0f4ff">' + esc(matchValueLabel) + '</span>' : ''}</div>
    </span>
    <span class="policy-text" style="text-align:right">${actionLabel}</span>
    <span class="policy-arrow">→</span>
    <span style="display:flex;gap:6px">
      <button class="btn-icon" title="Edit" onclick="editPolicy(${idx})">✎</button>
      <button class="btn-icon" title="Move up" onclick="movePolicy(${idx},-1)" ${idx === 0 ? 'disabled style="opacity:.3"' : ''}>▲</button>
      <button class="btn-icon" title="Move down" onclick="movePolicy(${idx},1)" ${idx === mwanPolicies.length - 1 ? 'disabled style="opacity:.3"' : ''}>▼</button>
      <button class="btn-icon" title="Delete" onclick="deletePolicy(${idx})">🗑</button>
    </span>
  `;
  return div;
}

    </div>
  `;
  document.body.appendChild(modal);

  // Init match-value dropdown based on type
  window._policyPppoePkgOpts = pppoePkgOpts;
  window._policyHsPkgOpts = hsPkgOpts;
  window._policySubOpts = subOpts;
  onPolicyMatchTypeChange();
  onPolicyActionTypeChange();

  if (existing.match_value) {
    setTimeout(() => {
      const mv = document.getElementById('pp-match-value');
      if (mv) mv.value = existing.match_value;
    }, 50);
  }
  if (existing.target_link_id) {
    setTimeout(() => {
      const tl = document.getElementById('pp-target-link');
      if (tl) tl.value = existing.target_link_id;
    }, 50);
  }
  if (Array.isArray(existing.target_link_ids) && existing.target_link_ids.length) {
    setTimeout(() => {
      const tls = document.getElementById('pp-target-links');
      if (tls) {
        [...tls.options].forEach(o => o.selected = existing.target_link_ids.includes(o.value));
      }
    }, 50);
  }
}

function onPolicyMatchTypeChange() {
  const t = document.getElementById('pp-match-type').value;
  const wrap = document.getElementById('pp-match-value-wrap');
  const label = document.getElementById('pp-match-value-label');
  const sel = document.getElementById('pp-match-value');
  if (t === 'all_pppoe' || t === 'all_hotspot') {
    wrap.style.display = 'none';
  } else {
    wrap.style.display = '';
    if (t === 'pppoe_package') { label.textContent = 'PPPoE Package'; sel.innerHTML = window._policyPppoePkgOpts || ''; }
    if (t === 'hotspot_package') { label.textContent = 'Hotspot Package'; sel.innerHTML = window._policyHsPkgOpts || ''; }
    if (t === 'pppoe_subscriber') { label.textContent = 'PPPoE Subscriber'; sel.innerHTML = window._policySubOpts || ''; }
  }
}

function onPolicyActionTypeChange() {
  const t = document.getElementById('pp-action-type').value;
  document.getElementById('pp-link-single-wrap').style.display = (t === 'use_link') ? '' : 'none';
  document.getElementById('pp-link-multi-wrap').style.display = (t === 'load_balance_pool') ? '' : 'none';
}

function closePolicyModal() {
  const m = document.getElementById('policy-modal');
  if (m) m.remove();
}

function savePolicyFromModal(idx) {
  const name = document.getElementById('pp-name').value.trim() || 'Unnamed';
  const match_type = document.getElementById('pp-match-type').value;
  const mvEl = document.getElementById('pp-match-value');
  const match_value = (match_type === 'all_pppoe' || match_type === 'all_hotspot') ? null : (mvEl && mvEl.value || null);
  const action_type = document.getElementById('pp-action-type').value;
  let target_link_id = null;
  let target_link_ids = [];
  if (action_type === 'use_link') {
    target_link_id = document.getElementById('pp-target-link').value || null;
  } else {
    target_link_ids = [...document.getElementById('pp-target-links').selectedOptions].map(o => o.value);
  }

  const policy = { name, match_type, match_value, action_type, target_link_id, target_link_ids };
  if (idx === -1) {
    policy.id = null;
    policy.priority = mwanPolicies.length + 1;
    mwanPolicies.push(policy);
  } else {
    mwanPolicies[idx] = { ...mwanPolicies[idx], ...policy };
  }
  closePolicyModal();
  renderWanPolicies();
}

function movePolicy(idx, dir) {
  const t = idx + dir;
  if (t < 0 || t >= mwanPolicies.length) return;
  [mwanPolicies[idx], mwanPolicies[t]] = [mwanPolicies[t], mwanPolicies[idx]];
  mwanPolicies.forEach((p, i) => p.priority = i + 1);
  renderWanPolicies();
}

function deletePolicy(idx) {
  if (!confirm('Remove policy "' + (mwanPolicies[idx].name || 'this policy') + '"?')) return;
  mwanPolicies.splice(idx, 1);
  mwanPolicies.forEach((p, i) => p.priority = i + 1);
  renderWanPolicies();
}

function gatherMwanForm() {
  return {
    mode: mwanCurrentMode,
    check_interval_sec: parseInt(document.getElementById('mwan-check-interval').value) || 10,
    fail_threshold: parseInt(document.getElementById('mwan-fail-threshold').value) || 3,
    pcc_mode: document.getElementById('mwan-pcc-mode').value || 'both-addresses',
    wan_quality_enabled: document.getElementById('wq-enabled').checked, /* RL_QUALITY_DASH */
    wan_quality_latency_ms: parseInt(document.getElementById('wq-latency').value) || 100,
    wan_quality_jitter_ms: parseInt(document.getElementById('wq-jitter').value) || 30,
    wan_quality_loss_pct: parseInt(document.getElementById('wq-loss').value) || 2,
    wan_quality_trip_count: parseInt(document.getElementById('wq-trip').value) || 3,
    wan_quality_recover_count: parseInt(document.getElementById('wq-recover').value) || 20,
    links: mwanLinks.map((l, i) => ({
      id: l.id,
      position: i + 1,
      name: l.name,
      interface: l.interface,
      gateway: l.gateway || null,
      ping_target: l.ping_target || '8.8.8.8',
      role: l.role,
      lb_weight: l.lb_weight || 50,
      in_load_balance: l.in_load_balance === true,
      is_failover: l.is_failover === true,
      failover_priority: l.failover_priority || null,
      enabled: l.enabled !== false
    })),
    policies: mwanPolicies.map((p, i) => ({
      id: p.id,
      priority: i + 1,
      name: p.name,
      match_type: p.match_type,
      match_value: p.match_value,
      action_type: p.action_type,
      target_link_id: p.target_link_id || null,
      target_link_ids: p.target_link_ids || [],
      enabled: p.enabled !== false
    }))
  };
}

async function saveMwanConfig() {
  // Validation
  const ifaces = mwanLinks.map(l => l.interface);
  const dupes = ifaces.filter((x, i) => ifaces.indexOf(x) !== i);
  if (dupes.length) {
    showMwanToast('Error: Interface "' + dupes[0] + '" is used by multiple links.', 'error');
    return;
  }
  if (mwanCurrentMode !== 'none' && !mwanLinks.length) {
    showMwanToast('Error: Add at least one WAN link.', 'error');
    return;
  }

  const cfg = gatherMwanForm();
  const btn = event && event.target;
  const originalText = btn ? btn.innerHTML : null;
  if (btn) { btn.disabled = true; btn.innerHTML = '⏳ Saving...'; }

  console.log('[mwan] Saving config:', cfg);
  try {
    const r = await api('/nas/' + encodeURIComponent(deviceId) + '/multi-wan', {
      method: 'PUT', body: JSON.stringify(cfg)
    });
    console.log('[mwan] Save response:', r);
    if (r && !r.error) {
      showSavedBadge();
      showMwanToast('✓ Settings saved successfully!', 'success');
      // Reload to get fresh IDs from server
      await loadMwanConfig();
    } else {
      showMwanToast('Save failed: ' + (r?.error || 'Unknown error'), 'error');
    }
  } catch (e) {
    console.error('[mwan] Save error:', e);
    showMwanToast('Save failed: ' + e.message, 'error');
  } finally {
    if (btn) { btn.disabled = false; btn.innerHTML = originalText; }
  }
}

// v62.99: Apply Multi-WAN config to MikroTik via REST
async function previewMwanConfig() {
  try {
    const d = await api('/nas/' + encodeURIComponent(deviceId) + '/multi-wan/preview');
    if (!d || d.error) {
      showMwanToast('Preview failed: ' + (d?.error || 'unknown'), 'error');
      return;
    }
    showMwanPreviewModal(d);
  } catch (e) {
    showMwanToast('Preview failed: ' + e.message, 'error');
  }
}

function showMwanPreviewModal(plan) {
  const modal = document.createElement('div');
  modal.id = 'mwan-preview-modal';
  modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:9998;display:flex;align-items:center;justify-content:center;padding:20px';

  const opsHtml = plan.operations.map((op, i) => {
    let icon = '⚙';
    let bg = 'rgba(13,21,48,.6)';
    if (op.cleanup) { icon = '🧹'; bg = 'rgba(243,156,18,.06)'; }
    else if (op.prepare) { icon = '🔌'; bg = 'rgba(155,89,182,.06)'; }
    else if (op.method === 'PUT' || op.method === 'POST') { icon = '✚'; bg = 'rgba(0,212,170,.06)'; }
    return `<div style="display:flex;gap:10px;padding:8px 12px;background:${bg};border-radius:6px;margin-bottom:6px;font-size:.82rem">
      <div style="color:#8899bb;min-width:24px">${i + 1}.</div>
      <div style="flex:1;color:#f0f4ff">${esc(op.description)}</div>
    </div>`;
  }).join('');

  modal.innerHTML = `
    <div style="background:#0d1530;border:1px solid #1e2f52;border-radius:14px;padding:24px;max-width:720px;width:100%;max-height:90vh;overflow:hidden;display:flex;flex-direction:column">
      <h3 style="color:#fff;margin:0 0 6px">📋 Preview Multi-WAN Configuration</h3>
      <p style="color:#8899bb;font-size:.82rem;margin:0 0 14px">
        Mode: <strong style="color:#00d4aa">${esc(plan.mode)}</strong> &nbsp;·&nbsp;
        Links: <strong style="color:#fff">${plan.link_count}</strong> &nbsp;·&nbsp;
        Policies: <strong style="color:#fff">${plan.policy_count}</strong>
      </p>
      <div style="border-top:1px solid #1e2f52;padding-top:12px;margin-top:4px"></div>
      <div style="overflow-y:auto;flex:1;margin-bottom:14px;padding-right:6px">
        <div style="color:#8899bb;font-size:.78rem;margin-bottom:8px">The following operations will be performed on the MikroTik:</div>
        ${opsHtml}
      </div>
      <div style="background:rgba(243,156,18,.06);border:1px solid rgba(243,156,18,.2);border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:.78rem;color:#f0f4ff">
        ⚠️ Existing client connections may briefly drop while routes are reconfigured.
      </div>
      <div style="display:flex;gap:10px;justify-content:flex-end">
        <button class="btn" onclick="closeMwanPreviewModal()">Cancel</button>
        <button class="btn btn-purple" onclick="closeMwanPreviewModal(); applyMwanToRouter()">⚡ Apply to Router</button>
      </div>
    </div>
  `;
  document.body.appendChild(modal);
}

function closeMwanPreviewModal() {
  const m = document.getElementById('mwan-preview-modal');
  if (m) m.remove();
}

async function applyMwanToRouter() {
  if (!confirm('Apply this Multi-WAN configuration to the MikroTik?\n\nExisting client connections may briefly drop while routes are reconfigured.')) return;
  const applyBtn = document.getElementById('mwan-apply-btn');
  if (applyBtn) { applyBtn.disabled = true; applyBtn.innerHTML = '⏳ Applying...'; }
  showMwanProgressModal();
  try {
    const d = await api('/nas/' + encodeURIComponent(deviceId) + '/multi-wan/apply', { method: 'POST' });
    closeMwanProgressModal();
    if (d && d.ok) {
      showMwanToast(`✓ Applied to router: ${d.applied_count} operations succeeded`, 'success');
      await loadMwanConfig();
    } else {
      const errSummary = d.errors && d.errors.length 
        ? d.errors.slice(0, 3).join('\n') + (d.errors.length > 3 ? `\n+ ${d.errors.length - 3} more...` : '')
        : 'Unknown error';
      showMwanToast(`Apply finished with ${d.error_count || 0} error(s). ${d.applied_count || 0} ops succeeded.`, 'error');
      console.error('[mwan apply] errors:', d.errors);
      if (d.error_count > 0) alert('Some apply operations failed:\n\n' + errSummary + '\n\nCheck console for full list. Router config is partially applied.');
      await loadMwanConfig();
    }
  } catch (e) {
    closeMwanProgressModal();
    console.error('[mwan apply] failed:', e);
    showMwanToast('Apply failed: ' + e.message, 'error');
  } finally {
    if (applyBtn) { applyBtn.disabled = false; applyBtn.innerHTML = '⚡ Apply to Router'; }
  }
}

async function revertMwanConfig() {
  if (!confirm('Remove all Multi-WAN configuration from the MikroTik?\n\nThis will restore single-WAN behavior. Existing connections may drop.')) return;
  const revertBtn = document.getElementById('mwan-revert-btn');
  if (revertBtn) { revertBtn.disabled = true; revertBtn.innerHTML = '⏳ Reverting...'; }
  try {
    const d = await api('/nas/' + encodeURIComponent(deviceId) + '/multi-wan/revert', { method: 'POST' });
    if (d && d.ok) {
      showMwanToast(`✓ Reverted: ${d.removed_count} objects removed`, 'success');
      await loadMwanConfig();
    } else {
      showMwanToast('Revert failed: ' + (d?.error || 'Unknown'), 'error');
    }
  } catch (e) {
    showMwanToast('Revert failed: ' + e.message, 'error');
  } finally {
    if (revertBtn) { revertBtn.disabled = false; revertBtn.innerHTML = '↺ Revert from Router'; }
  }
}

function showMwanProgressModal() {
  const modal = document.createElement('div');
  modal.id = 'mwan-progress-modal';
  modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:9999;display:flex;align-items:center;justify-content:center';
  modal.innerHTML = `
    <div style="background:#0d1530;border:1px solid #1e2f52;border-radius:14px;padding:32px 40px;text-align:center;max-width:420px">
      <div style="font-size:2.6rem;margin-bottom:12px;animation:spin 1.5s linear infinite">⚙</div>
      <h3 style="color:#fff;margin:0 0 6px">Applying to Router</h3>
      <p style="color:#8899bb;font-size:.85rem;margin:0">Pushing routing tables, mangle rules, and address-lists to the MikroTik. This typically takes 10-30 seconds.</p>
    </div>
    <style>@keyframes spin { from { transform: rotate(0) } to { transform: rotate(360deg) } }</style>
  `;
  document.body.appendChild(modal);
}

function closeMwanProgressModal() {
  const m = document.getElementById('mwan-progress-modal');
  if (m) m.remove();
}

function updateMwanStatusBanner(cfg) {
  const banner = document.getElementById('mwan-status-banner');
  const title = document.getElementById('mwan-status-title');
  const text = document.getElementById('mwan-status-text');
  const revertBtn = document.getElementById('mwan-revert-btn');
  if (!banner || !title || !text) return;
  if (!cfg.applied_at) {
    banner.className = 'status-banner';
    title.textContent = 'Configuration not yet applied to router';
    text.textContent = mwanLinks.length + ' link(s), ' + mwanPolicies.length + ' policy/policies saved server-side. Click "Apply to Router" to push to the MikroTik.';
    if (revertBtn) revertBtn.style.display = 'none';
  } else {
    banner.className = 'status-banner success';
    title.textContent = '✓ Active on router';
    text.textContent = 'Last applied: ' + new Date(cfg.applied_at).toLocaleString() + ' · ' + mwanLinks.length + ' link(s), ' + mwanPolicies.length + ' polic' + (mwanPolicies.length === 1 ? 'y' : 'ies');
    if (revertBtn) revertBtn.style.display = '';
  }
}

function showSavedBadge() {
  const b = document.getElementById('mwan-saved-badge');
  if (b) { b.style.display = ''; setTimeout(() => b.style.display = 'none', 3000); }
}
function hideSavedBadge() {
  const b = document.getElementById('mwan-saved-badge');
  if (b) b.style.display = 'none';
}

function showMwanToast(message, type) {
  type = type || 'success';
  let toast = document.getElementById('mwan-toast');
  if (!toast) {
    toast = document.createElement('div');
    toast.id = 'mwan-toast';
    toast.style.cssText = 'position:fixed;top:80px;right:20px;padding:14px 22px;border-radius:10px;font-size:.92rem;font-weight:600;z-index:9999;box-shadow:0 10px 40px rgba(0,0,0,.5);transform:translateX(450px);transition:transform .35s cubic-bezier(.34,1.56,.64,1);max-width:380px;line-height:1.4';
    document.body.appendChild(toast);
  }
  if (type === 'success') {
    toast.style.background = 'linear-gradient(135deg,#00d4aa,#00b294)';
    toast.style.color = '#0a0f1e';
    toast.style.border = '1px solid #00d4aa';
  } else if (type === 'error') {
    toast.style.background = 'linear-gradient(135deg,#e74c3c,#c0392b)';
    toast.style.color = '#fff';
    toast.style.border = '1px solid #e74c3c';
  } else {
    toast.style.background = 'linear-gradient(135deg,#3498db,#2980b9)';
    toast.style.color = '#fff';
    toast.style.border = '1px solid #3498db';
  }
  toast.textContent = message;
  requestAnimationFrame(() => { toast.style.transform = 'translateX(0)'; });
  if (toast._timeout) clearTimeout(toast._timeout);
  toast._timeout = setTimeout(() => { toast.style.transform = 'translateX(450px)'; }, 3500);
}
